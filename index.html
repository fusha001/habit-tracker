<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ 小习惯打卡</title>

    <!-- Tailwind CSS CDN：引入原子化 CSS 框架 -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- Supabase SDK：实时数据库同步 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <!-- 自定义 Tailwind 主题配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    // 圆润字体栈：优先系统原生字体，无需 Google Fonts
                    fontFamily: {
                        'round': ['PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', 'MiSans', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- ==================== 自定义样式 ==================== -->
    <style>
        /* ----- 全局基础 ----- */
        * {
            -webkit-tap-highlight-color: transparent;
            /* 移除移动端点击高亮 */
            -webkit-user-select: none;
            /* 禁止文字选中（提升原生App感） */
            user-select: none;
        }

        body {
            /* 马卡龙渐变背景：粉→紫→蓝 */
            background: linear-gradient(160deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            /* 动态视口高度，适配移动端浏览器地址栏 */;
        }

        /* ----- 卡片通用样式 ----- */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 22px;
            box-shadow: 0 4px 20px rgba(149, 117, 205, 0.10), 0 1px 3px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            transform: scale(0.985);
            box-shadow: 0 2px 10px rgba(149, 117, 205, 0.08);
        }

        /* ----- 按钮点击缩放动效 ----- */
        .btn-tap {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
            cursor: pointer;
        }
        .btn-tap:active {
            transform: scale(0.92);
        }

        /* ----- 浮动操作按钮（FAB）----- */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8bbd0, #ce93d8);
            box-shadow: 0 6px 24px rgba(206, 147, 216, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            z-index: 40;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
            cursor: pointer;
        }
        .fab:active {
            transform: scale(0.88);
            box-shadow: 0 3px 12px rgba(206, 147, 216, 0.35);
        }

        /* ----- 弹窗遮罩与动画 ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.30);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            /* 移动端从底部弹出 */
            justify-content: center;
            animation: fadeIn 0.22s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .modal-sheet {
            background: #fff;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 32px;
            box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        /* ----- Toast 轻提示 ----- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(50, 50, 50, 0.88);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            pointer-events: none;
            animation: toastIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), toastOut 0.3s 1.5s ease forwards;
            white-space: nowrap;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        /* ----- 日历展开/折叠过渡 ----- */
        .calendar-wrap {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.30s ease;
        }
        .calendar-wrap.open {
            grid-template-rows: 1fr;
        }
        .calendar-inner {
            overflow: hidden;
        }

        /* ----- 颜色选择圆点 ----- */
        .color-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 3px solid transparent;
        }
        .color-dot:active {
            transform: scale(0.88);
        }
        .color-dot.selected {
            border-color: #7e57c2;
            box-shadow: 0 0 0 4px rgba(126, 87, 194, 0.18);
            transform: scale(1.12);
        }

        /* ----- 自定义滚动条（WebKit）----- */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1c4e9;
            border-radius: 99px;
        }

        /* ----- 徽章行样式 ----- */
        .badge-chip {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 15px;
            padding: 2px 6px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 1px 4px rgba(149,117,205,0.12);
            transition: transform 0.2s ease;
            cursor: default;
            animation: badgePopIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes badgePopIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        /* ----- 日历日记小圆点指示器 ----- */
        .diary-dot {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f8bbd0;
            box-shadow: 0 0 4px rgba(248,187,208,0.6);
        }

        /* ----- 徽章解锁庆祝动画（全屏一次）----- */
        .badge-unlock-overlay {
            position: fixed;
            inset: 0;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.25);
            animation: fadeIn 0.2s ease;
            pointer-events: none;
        }
        .badge-unlock-card {
            text-align: center;
            background: #fff;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 12px 48px rgba(149,117,205,0.30);
            animation: badgeBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes badgeBounce {
            0%   { transform: scale(0.3); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .badge-unlock-icon {
            font-size: 64px;
            animation: badgeSparkle 0.6s ease;
        }
        @keyframes badgeSparkle {
            0%   { transform: rotate(-15deg) scale(0.5); opacity: 0; }
            50%  { transform: rotate(5deg) scale(1.2); }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        /* ----- 日记弹窗内的删除打卡按钮 ----- */
        .btn-uncheck {
            background: #fff0f0;
            color: #e57373;
            border: 1.5px solid #ffcdd2;
        }
        .btn-uncheck:active {
            background: #ffebee;
        }

        /* ====== 新增功能样式 ====== */

        /* ----- 视图切换标签栏 ----- */
        .view-toggle {
            display: flex;
            background: rgba(255,255,255,0.55);
            border-radius: 16px;
            padding: 3px;
            gap: 2px;
        }
        .view-toggle button {
            flex: 1;
            padding: 7px 0;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: #b39ddb;
        }
        .view-toggle button.active {
            background: #fff;
            color: #7e57c2;
            box-shadow: 0 2px 8px rgba(149,117,205,0.15);
        }

        /* ----- 周视图样式 ----- */
        .week-strip {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .week-cell {
            aspect-ratio: 1;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        /* ----- 年度热力图样式 ----- */
        .heatmap-grid {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }
        .heatmap-week {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .heatmap-cell {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            background: #f0e6f6;
            transition: transform 0.15s ease;
        }
        .heatmap-cell.filled {
            transform: scale(1.0);
        }
        .heatmap-cell:active {
            transform: scale(1.8);
            z-index: 2;
        }

        /* ----- 心情 emoji 选择器 ----- */
        .mood-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .mood-emoji {
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
            opacity: 0.45;
            filter: grayscale(30%);
        }
        .mood-emoji.selected {
            transform: scale(1.3);
            opacity: 1;
            filter: grayscale(0%);
        }
        .mood-emoji:active {
            transform: scale(0.85);
        }

        /* ----- 分组标签 ----- */
        .group-tag {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(206,147,216,0.12);
            color: #ab47bc;
        }

        /* ----- 分组筛选标签栏 ----- */
        .group-filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .group-filter-bar::-webkit-scrollbar { display: none; }
        .group-filter-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.6);
            color: #b39ddb;
            white-space: nowrap;
        }
        .group-filter-chip.active {
            background: linear-gradient(135deg, #ce93d8, #ab47bc);
            color: #fff;
            box-shadow: 0 3px 12px rgba(171,71,188,0.25);
        }

        /* ----- 排序按钮 ----- */
        .sort-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(206,147,216,0.1);
            color: #b39ddb;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            line-height: 1;
        }
        .sort-btn:active {
            transform: scale(0.85);
            background: rgba(206,147,216,0.25);
        }

        /* ----- 设置面板（底部滑出）----- */
        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.12);
            z-index: 55;
            padding: 20px;
            animation: slideUp 0.28s cubic-bezier(0.22,0.61,0.36,1);
            display: none;
        }
        .settings-panel.open {
            display: block;
        }

        /* ----- 分享卡片 Canvas 容器 ----- */
        .share-canvas-wrap {
            position: fixed;
            inset: 0;
            z-index: 130;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.2s ease;
        }
        .share-canvas-wrap canvas {
            border-radius: 20px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.25);
            max-width: 90vw;
        }

        /* ----- 补签卡小标识 ----- */
        .makeup-badge {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffe082, #ffb74d);
            color: #e65100;
            box-shadow: 0 1px 4px rgba(255,183,77,0.3);
        }

        /* ----- 休息日标记 ----- */
        .rest-day-indicator {
            font-size: 10px;
            position: absolute;
            top: 0px;
            right: 1px;
            opacity: 0.7;
        }

        /* ====== 🎰 扭蛋机样式 ====== */
        .gacha-overlay {
            position: fixed; inset: 0; z-index: 130;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .gacha-machine {
            background: linear-gradient(180deg, #fff9f0 0%, #fff 40%);
            border-radius: 28px; padding: 28px 24px;
            width: 320px; text-align: center;
            box-shadow: 0 16px 56px rgba(0,0,0,0.25);
            position: relative; overflow: hidden;
        }
        .gacha-sphere {
            width: 100px; height: 100px; border-radius: 50%;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px;
            animation: gachaShake 0.6s ease-in-out;
            box-shadow: 0 8px 32px rgba(255,154,158,0.4), inset 0 -4px 12px rgba(0,0,0,0.1);
        }
        @keyframes gachaShake {
            0%,100% { transform: rotate(0); }
            15% { transform: rotate(-15deg) scale(1.05); }
            30% { transform: rotate(12deg) scale(0.95); }
            45% { transform: rotate(-10deg) scale(1.03); }
            60% { transform: rotate(8deg) scale(0.97); }
            75% { transform: rotate(-4deg) scale(1.01); }
        }
        .gacha-prize-reveal {
            animation: prizePop 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes prizePop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .gacha-tier-N { color: #b39ddb; }
        .gacha-tier-R { color: #64b5f6; }
        .gacha-tier-SR { color: #ffb74d; }
        .gacha-tier-SSR {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            animation: ssrGlow 0.8s ease-in-out infinite alternate;
        }
        @keyframes ssrGlow {
            from { text-shadow: 0 0 10px rgba(255,215,0,0.5); }
            to { text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,152,0,0.6); }
        }

        /* ====== 🌸 虚拟花园样式 ====== */
        .garden-area {
            display: flex; gap: 6px; overflow-x: auto;
            padding: 8px 4px; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .garden-area::-webkit-scrollbar { display: none; }
        .garden-plant {
            flex-shrink: 0; width: 52px; height: 60px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 28px;
            border-radius: 14px; cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.5);
        }
        .garden-plant.wilted { filter: grayscale(80%) brightness(0.8); }
        .garden-plant .plant-name {
            font-size: 8px; font-weight: 700; color: #9c27b0;
            max-width: 48px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; margin-top: 1px;
        }
        .garden-water-drop {
            position: absolute;
            animation: waterDrop 0.8s ease-out forwards;
            font-size: 14px; pointer-events: none; z-index: 60;
        }
        @keyframes waterDrop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.3); opacity: 0; }
        }

        /* ====== 🎵 BGM 播放器样式 ====== */
        .bgm-fab {
            position: fixed; bottom: 96px; right: 24px;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(6px);
            box-shadow: 0 4px 16px rgba(149,117,205,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 39; cursor: pointer;
            transition: transform 0.15s ease;
        }
        .bgm-fab:active { transform: scale(0.9); }
        .bgm-fab.playing { background: #ce93d8; color: #fff; }
        .bgm-panel {
            position: fixed; bottom: 150px; right: 20px;
            background: #fff; border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            padding: 12px; z-index: 38; width: 200px;
            display: none;
        }
        .bgm-panel.open { display: block; animation: fadeIn 0.2s ease; }
        .bgm-track {
            padding: 8px 12px; border-radius: 12px; cursor: pointer;
            font-size: 13px; font-weight: 600; color: #7e57c2;
            transition: background 0.15s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .bgm-track:hover, .bgm-track.active { background: #f3e5f5; }
        .bgm-track.locked { color: #d1c4e9; pointer-events: none; }

        /* ====== 🎉 彩蛋 & 节日特效 ====== */
        .confetti-piece {
            position: fixed; z-index: 200; pointer-events: none;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .firework-particle {
            position: fixed; z-index: 200; pointer-events: none;
            width: 6px; height: 6px; border-radius: 50%;
            animation: fireworkBurst 0.8s ease-out forwards;
        }
        @keyframes fireworkBurst {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
        }
        .snowflake {
            position: fixed; z-index: 199; pointer-events: none;
            animation: snowFall linear forwards;
            font-size: 20px;
        }
        @keyframes snowFall {
            0% { transform: translateY(-5vh) translateX(0); opacity: 1; }
            100% { transform: translateY(105vh) translateX(40px); opacity: 0.2; }
        }

        /* ====== 🏆 挑战模式样式 ====== */
        .challenge-card {
            background: rgba(255,255,255,0.8); border-radius: 16px;
            padding: 12px 14px; box-shadow: 0 2px 12px rgba(149,117,205,0.08);
        }
        .challenge-progress {
            height: 8px; border-radius: 99px; background: #f3e5f5;
            overflow: hidden; margin-top: 4px;
        }
        .challenge-progress-fill {
            height: 100%; border-radius: 99px;
            background: linear-gradient(90deg, #ce93d8, #f48fb1);
            transition: width 0.4s ease;
        }

        /* ====== 🎨 主题皮肤样式 ====== */
        .theme-card {
            flex-shrink: 0; width: 100px; padding: 10px 8px;
            border-radius: 16px; text-align: center; cursor: pointer;
            border: 2.5px solid transparent; transition: all 0.2s ease;
            background: rgba(255,255,255,0.6);
        }
        .theme-card.active { border-color: #7e57c2; box-shadow: 0 0 0 3px rgba(126,87,194,0.15); }
        .theme-card.locked { opacity: 0.5; filter: grayscale(30%); }
        .theme-card:active { transform: scale(0.95); }
        .theme-preview-circle {
            width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        /* ====== 📸 照片附件样式 ====== */
        .photo-thumb {
            width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
            border: 2px solid #f3e5f5; cursor: pointer;
            transition: transform 0.15s ease;
        }
        .photo-thumb:active { transform: scale(0.9); }
        .photo-thumb-wrap { position: relative; display: inline-block; margin: 2px; }
        .photo-delete-btn {
            position: absolute; top: -6px; right: -6px;
            width: 18px; height: 18px; border-radius: 50%;
            background: #ef5350; color: #fff; font-size: 10px;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .photo-viewer {
            position: fixed; inset: 0; z-index: 160;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .photo-viewer img {
            max-width: 92vw; max-height: 85vh; border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .photo-indicator {
            font-size: 8px; position: absolute; top: 1px; left: 2px; opacity: 0.9;
        }

        /* ====== 🗓 节日节气日历标记 ====== */

            line-height: 1; pointer-events: none;
        }
        .festival-tooltip {
            position: absolute; bottom: calc(100% + 6px); left: 50%;
            transform: translateX(-50%);
            background: #7e57c2; color: #fff; font-size: 10px;
            padding: 3px 8px; border-radius: 8px; white-space: nowrap;
            pointer-events: none; z-index: 99; font-weight: 600;
            box-shadow: 0 4px 12px rgba(126,87,194,0.3);
            display: none;
        }
        .festival-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent; border-top-color: #7e57c2;
        }

        /* ====== 群组管理样式 ====== */

        .group-del-btn:active { transform: scale(0.85); }

            display: flex; gap: 6px; margin-top: 4px;
        }

        /* ====== 💝 纪念日 & ✅ 待办样式 ====== */
        .anniversary-dot {
            position: absolute; bottom: 2px; right: 2px;
            font-size: 8px; line-height: 1;
        }
        .todo-dot {
            position: absolute; top: 2px; left: 2px;
            width: 7px; height: 7px; border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 3px rgba(76,175,80,0.5);
        }
        .todo-dot.done { background: #bdbdbd; box-shadow: none; }
        .todo-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; border-radius: 12px;
            background: rgba(255,255,255,0.65);
            margin-bottom: 4px;
            transition: all 0.2s ease;
        }
        .todo-item.done .todo-text { text-decoration: line-through; color: #bdbdbd; }
        .todo-check {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #ce93d8; flex-shrink: 0;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 10px; color: #fff;
            transition: all 0.15s ease;
        }
        .todo-check.checked { background: #66bb6a; border-color: #66bb6a; }
        .anniversary-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 10px;
            background: rgba(255,255,255,0.5); margin-bottom: 3px;
        }
        .ann-countdown {
            font-size: 10px; font-weight: 700; color: #e91e63;
            margin-left: auto; flex-shrink: 0;
        }

        /* ====== 日历点击动效 ====== */
        .cal-cell-ripple {
            animation: calRipple 0.35s cubic-bezier(0.22,0.61,0.36,1);
        }
        @keyframes calRipple {
            0% { transform: scale(0.85); filter: brightness(1.3); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* ====== 年月选择器 ====== */
        .ym-picker-overlay {
            position: fixed; inset: 0; z-index: 150;
            background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.15s ease;
        }
        .ym-picker {
            background: #fff; border-radius: 24px; padding: 20px;
            width: 300px; max-height: 70vh; overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            animation: slideUp 0.25s cubic-bezier(0.22,0.61,0.36,1);
        }
        .ym-picker h3 {
            text-align: center; font-size: 15px; font-weight: 800;
            color: #7e57c2; margin-bottom: 12px;
        }
        .ym-year-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
            margin-bottom: 16px;
        }
        .ym-month-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        }
        .ym-btn {
            padding: 10px 0; border-radius: 12px; border: none;
            font-size: 13px; font-weight: 700; cursor: pointer;
            background: #f5f0fa; color: #7e57c2;
            transition: all 0.15s ease; text-align: center;
        }
        .ym-btn:active { transform: scale(0.92); }
        .ym-btn.active {
            background: linear-gradient(135deg, #ce93d8, #ab47bc);
            color: #fff; box-shadow: 0 3px 12px rgba(171,71,188,0.3);
        }
        .ym-btn.today {
            border: 2px solid #ce93d8;
        }
        .ym-close {
            display: block; width: 100%; margin-top: 14px; padding: 10px;
            border-radius: 14px; border: none; font-size: 14px; font-weight: 700;
            cursor: pointer; background: #f0f0f0; color: #999;
        }

        /* ====== 👥 好友系统样式 ====== */
        .friend-card {
            background: rgba(255,255,255,0.8); border-radius: 18px; padding: 14px;

        }
        .friend-streak-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
    </style>
</head>

            const LUNAR_INFO = [

            /** 农历月份名 */
            const LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];

            /** 农历日期名（0=空, 1-10=初X, 11-20=十X/廿X, 21-30=廿X/三十） */
            function getLunarDayName(day) {
                if (day < 1 || day > 30) return '';
                if (day === 10) return '初十';
                if (day === 20) return '二十';
                if (day === 30) return '三十';
                const tens = ['', '初', '十', '廿', '卅'];
                const ones = ['', '一','二','三','四','五','六','七','八','九','十'];
                const t = Math.floor(day / 10);
                const o = day % 10;
                if (t === 0) return '初' + ones[o];
                if (t === 1) return '十' + (o === 0 ? '' : ones[o]);
                if (t === 2) return '廿' + (o === 0 ? '' : ones[o]);
                return '';

            /**
             * 公历转农历
             * @param {Date} date - 公历日期
             * @returns {{ year:number, month:number, day:number, isLeap:boolean, yearName:string, monthName:string, dayName:string }}
             */
            function solarToLunar(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                const day = date.getDate();

                // 边界保护：只支持 1900-2100 年
                if (year < 1900 || year > 2100) {
                    return { year: year, month: month, day: day, isLeap: false,
                        yearName: '', monthName: '', dayName: '' };
                }

                // 计算从1900年1月31日（农历庚子年正月初一）到目标日期的天数
                const baseDate = new Date(1900, 0, 31);
                let offset = Math.floor((date - baseDate) / 86400000);

                // 在农历数据中查找年份
                let lunarYear, lunarMonth, lunarDay, isLeap = false;
                for (lunarYear = 1900; lunarYear < 2101 && offset > 0; lunarYear++) {
                    const yearDays = lunarYearDays(lunarYear);
                    if (offset < yearDays) break;
                    offset -= yearDays;
                }

                // 查找月份
                const leapMonth = getLeapMonth(lunarYear);
                let isLeapMonth = false;
                for (lunarMonth = 1; lunarMonth <= 12 && offset > 0; lunarMonth++) {
                    if (leapMonth > 0 && lunarMonth === (leapMonth + 1) && !isLeapMonth) {
                        --lunarMonth;
                        isLeapMonth = true;
                        const leapDays = getLeapMonthDays(lunarYear);
                        if (offset < leapDays) break;
                        offset -= leapDays;
                        isLeapMonth = false;
                    }
                    const monthDays = getLunarMonthDays(lunarYear, lunarMonth);
                    if (offset < monthDays) break;
                    offset -= monthDays;
                }
                lunarDay = offset + 1;
                isLeap = isLeapMonth && lunarMonth === leapMonth;

                // 天干地支纪年
                const tianGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
                const diZhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
                const shengXiao = ['🐭鼠','🐮牛','🐯虎','🐰兔','🐲龙','🐍蛇','🐴马','🐏羊','🐵猴','🐔鸡','🐶狗','🐷猪'];
                const tgIdx = (lunarYear - 4) % 10;
                const dzIdx = (lunarYear - 4) % 12;
                const yearName = `${tianGan[tgIdx]}${diZhi[dzIdx]}${shengXiao[dzIdx]}年`;

                return {
                    year: lunarYear,
                    month: lunarMonth,
                    day: lunarDay,
                    isLeap: isLeap,
                    yearName: yearName,
                    monthName: (isLeap ? '闰' : '') + LUNAR_MONTHS[lunarMonth - 1] + '月',
                    dayName: getLunarDayName(lunarDay),
                };
            }

            /** 获取农历年总天数 */
            function lunarYearDays(year) {
                let days = 0;
                for (let m = 1; m <= 12; m++) days += getLunarMonthDays(year, m);
                const leap = getLeapMonth(year);
                if (leap > 0) days += getLeapMonthDays(year);
                return days;
            }

            /** 获取农历月天数（普通月，非闰月） */
            function getLunarMonthDays(year, month) {
                const info = LUNAR_INFO[year - 1900];
                return (info & (0x10000 >> month)) ? 30 : 29;
            }

            /** 获取闰月月份（0=无闰月） */
            function getLeapMonth(year) {
                return LUNAR_INFO[year - 1900] & 0xf;
            }

            /** 获取闰月天数 */
            function getLeapMonthDays(year) {
                const leap = getLeapMonth(year);
                if (leap === 0) return 0;
                return (LUNAR_INFO[year - 1900] & 0x10000) ? 30 : 29;
            }

            /** 获取某公历日期对应的农历节日名称（无则返回空字符串） */
            function getLunarFestival(lunar) {
                const m = lunar.month, d = lunar.day, leap = lunar.isLeap;
                if (leap) return '';
                if (m === 1 && d === 1) return '🧧 春节';
                if (m === 1 && d === 15) return '🏮 元宵节';
                if (m === 5 && d === 5) return '🐲 端午节';
                if (m === 7 && d === 7) return '💫 七夕';
                if (m === 7 && d === 15) return '👻 中元节';
                if (m === 8 && d === 15) return '🌕 中秋节';
                if (m === 9 && d === 9) return '🌺 重阳节';
                if (m === 12 && d === 8) return '🥣 腊八节';
                if (m === 12 && d === 23) return '🍬 小年';
                if (m === 12 && d === 30) return '🧨 除夕';
                if (m === 12 && d === 29 && getLunarMonthDays(lunar.year, 12) === 29) return '🧨 除夕';
                return '';
            }

            // ==================== 工具函数 ====================

            /**
             * 将 Date 对象格式化为 "YYYY-MM-DD" 字符串
             * @param {Date} date
             * @returns {string}
             */
            function formatDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            /**
             * 生成唯一 ID（时间戳 + 随机数）
             * @returns {string}
             */
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            /**
             * 获取某个月的总天数
             * @param {number} year
             * @param {number} month - 0-11
             * @returns {number}
             */
            function daysInMonth(year, month) {
                return new Date(year, month + 1, 0).getDate();
            }

            /**
             * 获取某月第一天是星期几（周一=0, 周日=6）
             * @param {number} year
             * @param {number} month - 0-11
             * @returns {number}
             */
            function firstDayOfMonth(year, month) {
                const jsDay = new Date(year, month, 1).getDay(); // 0=Sun, 1=Mon, ...
                // 转换为周一=0
                return jsDay === 0 ? 6 : jsDay - 1;
            }

            /**
             * 判断某个日期是否是今天
             * @param {string} dateStr - "YYYY-MM-DD"
             * @returns {boolean}
             */
            function isToday(dateStr) {
                return dateStr === formatDate(new Date());
            }

            /**
             * 判断某个日期是否在未来（不可打卡）
             * @param {string} dateStr - "YYYY-MM-DD"
             * @returns {boolean}
             */
            function isFuture(dateStr) {
                return new Date(dateStr) > new Date(formatDate(new Date()));
            }

            // ==================== 数据持久化（localStorage）====================

            /** 从 localStorage 加载数据（自动迁移旧版数据结构） */
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {

                        // 合并数据，保留当前视图状态

                        appData.customBgmTracks = parsed.customBgmTracks || [];

                        appData.todos = parsed.todos || [];

                        // 迁移旧数据：确保每个习惯都有所有必要字段
                        let migrated = false;
                        appData.habits.forEach((h, i) => {
                            if (!h.diaries) { h.diaries = {}; migrated = true; }
                            if (!h.badges) { h.badges = []; migrated = true; }

                            if (h.group === undefined) { h.group = ''; migrated = true; }
                            if (h.sortOrder === undefined) { h.sortOrder = i; migrated = true; }
                            if (h.reminderTime === undefined) { h.reminderTime = null; migrated = true; }
                            if (h.reminderEnabled === undefined) { h.reminderEnabled = false; migrated = true; }
                            if (h.makeUpCards === undefined) { h.makeUpCards = 0; migrated = true; }
                            if (!h.restDays) { h.restDays = []; migrated = true; }
                            if (!h.photos) { h.photos = {}; migrated = true; }
                        });

            /** 将数据保存至 localStorage */
            function saveData() {
                try {
                    const toSave = {
                        habits: appData.habits,

                } catch (e) {
                    console.warn('⚠️ 数据保存失败', e);
                    showToast('数据保存失败，请检查浏览器存储空间');
                }
            }

            // ==================== 统计计算 ====================

            /**
             * 计算连续打卡天数（从今天往回数，允许今天未打卡但从昨天开始计数）
             * @param {string[]} checkins - 打卡日期数组
             * @returns {number}
             */
            function calcStreak(checkins) {
                if (!checkins || checkins.length === 0) return 0;

                const checkinSet = new Set(checkins);
                const todayStr = formatDate(new Date());
                const d = new Date();

                // 尝试从今天开始计数
                let streak = 0;
                let startedCounting = false;

                for (let i = 0; i < 366; i++) {
                    const dateStr = formatDate(d);
                    if (checkinSet.has(dateStr)) {
                        streak++;
                        startedCounting = true;
                        d.setDate(d.getDate() - 1);
                    } else {
                        // 如果还没开始计数（即今天未打卡），跳过今天从昨天继续尝试
                        if (!startedCounting) {
                            d.setDate(d.getDate() - 1);
                            continue;
                        }
                        // 已经开始计数但遇到中断，停止
                        break;
                    }
                }
                return streak;
            }

            /**
             * 计算总打卡次数
             * @param {string[]} checkins
             * @returns {number}
             */
            function calcTotal(checkins) {
                return checkins ? checkins.length : 0;
            }

            /**
             * 计算月度完成率（百分比）
             * @param {string[]} checkins - 打卡日期数组
             * @param {number} year - 查看的年
             * @param {number} month - 查看的月（0-11）
             * @returns {number} 0-100 的整数
             */
            function calcMonthlyRate(checkins, year, month) {
                if (!checkins || checkins.length === 0) return 0;

                const today = new Date();
                const totalDaysInMonth = daysInMonth(year, month);

                // 当月：分母为今天日期；过往月：分母为当月总天数
                const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
                const denominator = isCurrentMonth ? today.getDate() : totalDaysInMonth;

                if (denominator === 0) return 0;

                // 筛选出属于该月的打卡记录
                const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
                const checkedCount = checkins.filter(d => d.startsWith(monthPrefix)).length;

                return Math.min(100, Math.round((checkedCount / denominator) * 100));
            }

            /**
             * 检查并解锁新徽章（根据当前连续打卡天数）
             * @param {Habit} habit - 习惯对象
             * @returns {Object|null} 新解锁的徽章信息，无新徽章则返回 null
             */
            function checkAndUnlockBadges(habit) {
                const streak = calcStreak(habit.checkins);
                let newlyUnlocked = null;

                // 按天数升序遍历所有徽章等级
                for (const tier of BADGE_TIERS) {
                    // 达到里程碑 且 尚未解锁
                    if (streak >= tier.days && !habit.badges.includes(tier.days)) {
                        habit.badges.push(tier.days);
                        newlyUnlocked = tier;
                    }
                }
                if (newlyUnlocked) saveData();
                return newlyUnlocked;
            }

            /**
             * 根据徽章里程碑天数查找徽章信息
             * @param {number} days - 里程碑天数
             * @returns {Object|undefined}
             */
            function getBadgeByDays(days) {
                return BADGE_TIERS.find(b => b.days === days);
            }

            /**
             * 获取某日的日记内容
             * @param {Habit} habit
             * @param {string} dateStr - "YYYY-MM-DD"
             * @returns {string}
             */
            function getDiary(habit, dateStr) {
                return (habit.diaries && habit.diaries[dateStr]) || '';
            }

            /**
             * 保存某日的日记内容
             * @param {Habit} habit
             * @param {string} dateStr - "YYYY-MM-DD"
             * @param {string} content - 日记文字
             */
            function saveDiary(habit, dateStr, content) {
                if (!habit.diaries) habit.diaries = {};
                const trimmed = content.trim();
                if (trimmed) {
                    habit.diaries[dateStr] = trimmed;
                } else {
                    // 空内容则删除该日记条目
                    delete habit.diaries[dateStr];
                }
                saveData();
            }

            // ==================== 心情记录 ====================

            /** 保存某日心情 */
            function saveMood(habit, dateStr, emoji) {
                if (!habit.moods) habit.moods = {};
                if (emoji) {
                    habit.moods[dateStr] = emoji;
                } else {
                    delete habit.moods[dateStr];
                }
                saveData();
            }

            /** 获取某日心情 */
            function getMood(habit, dateStr) {
                return (habit.moods && habit.moods[dateStr]) || '';
            }

            // ==================== 通知提醒 ====================

            /** 已触发过的提醒集合（防止同一天重复提醒） */
            let reminderFiredToday = {};

            /** 请求通知权限并启动提醒轮询 */
            function initNotifications() {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'default') {
                    // 延迟请求，避免页面加载时弹出
                    setTimeout(() => Notification.requestPermission(), 3000);
                }
                // 每 60 秒检查一次是否有需要触发的提醒
                setInterval(checkReminders, 60000);
                // 首次立即检查
                setTimeout(checkReminders, 2000);
            }

            /** 检查所有习惯的提醒时间 */
            function checkReminders() {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                const todayStr = formatDate(now);

                appData.habits.forEach(habit => {
                    if (!habit.reminderEnabled || !habit.reminderTime) return;
                    if (habit.reminderTime === timeStr) {
                        // 防止同一天同一习惯重复提醒
                        const key = habit.id + todayStr;
                        if (reminderFiredToday[key]) return;
                        reminderFiredToday[key] = true;

                        // 检查今天是否已打卡
                        if (!habit.checkins.includes(todayStr)) {
                            new Notification('⏰ 打卡提醒', {
                                body: `别忘了今天的「${habit.name}」哦～坚持就是胜利！`,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">✅</text></svg>',
                                tag: key,
                                requireInteraction: true,
                            });
                        }
                    }
                });
            }

            // ==================== 数据导出/导入 ====================

            /** 导出全部数据为 JSON 文件并触发下载 */
            function exportData() {
                const toSave = {
                    habits: appData.habits,
                    viewYear: appData.viewYear,
                    viewMonth: appData.viewMonth,
                    exportTime: new Date().toISOString(),

                a.download = `习惯打卡备份_${formatDate(new Date())}.json`;

            /** 从 JSON 文件导入数据 */
            function importData(file) {

                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);

                            throw new Error('无效的数据格式');

                        appData.habits.forEach((h, i) => {
                            if (!h.diaries) h.diaries = {};

                        appData.friends = data.friends || [];

                reader.readAsText(file);

            // ==================== 补签卡系统 ====================

            /**
             * 检查并发放补签卡（每连续30天奖励1张）
             * @param {Habit} habit
             * @returns {boolean} 是否发放了新补签卡
             */
            function awardMakeUpCard(habit) {
                const streak = calcStreak(habit.checkins);
                // 补签卡发放基于连续打卡天数：30→1张, 60→2张, 90→3张...
                const earnedCards = Math.floor(streak / 30);
                if (earnedCards > habit.makeUpCards) {
                    const newCards = earnedCards - habit.makeUpCards;
                    habit.makeUpCards = earnedCards;
                    saveData();
                    showToast(`🎫 获得 ${newCards} 张补签卡！连续 ${streak} 天太厉害了～`);
                    return true;
                }
                return false;
            }

            /** 使用补签卡填补遗漏日期 */
            function useMakeUpCard(habitId, dateStr) {
                const habit = findHabit(habitId);
                if (!habit) return false;
                if (habit.checkins.includes(dateStr)) {
                    showToast('这天已经打过卡了～');
                    return false;
                }
                if (habit.makeUpCards <= 0) {
                    showToast('🎫 补签卡不足，坚持打卡30天可获得补签卡');
                    return false;
                }
                habit.makeUpCards--;
                habit.checkins.push(dateStr);
                habit.checkins.sort();
                saveData();
                showToast('🎫 使用补签卡成功！');
                return true;
            }

            // ==================== 休息日管理 ====================

            /** 切换某日为休息日 */
            function toggleRestDay(habitId, dateStr) {
                const habit = findHabit(habitId);
                if (!habit) return;
                if (!habit.restDays) habit.restDays = [];
                const idx = habit.restDays.indexOf(dateStr);
                if (idx >= 0) {
                    habit.restDays.splice(idx, 1);
                } else {
                    habit.restDays.push(dateStr);
                }
                saveData();
            }

            /** 判断某日是否为休息日 */
            function isRestDay(habit, dateStr) {
                return habit.restDays && habit.restDays.includes(dateStr);
            }

            // ==================== 排序与分组 ====================

            /** 移动习惯排序位置 */
            function moveHabit(habitId, direction) {
                const habits = appData.habits;
                const idx = habits.findIndex(h => h.id === habitId);
                if (idx < 0) return;
                const newIdx = idx + direction;
                if (newIdx < 0 || newIdx >= habits.length) return;
                // 交换 sortOrder
                [habits[idx].sortOrder, habits[newIdx].sortOrder] = [habits[newIdx].sortOrder, habits[idx].sortOrder];
                // 交换数组位置
                [habits[idx], habits[newIdx]] = [habits[newIdx], habits[idx]];
                saveData();
                renderAll();
            }

            /** 获取过滤并排序后的习惯列表 */
            function getFilteredHabits() {
                let habits = [...appData.habits];
                // 按 sortOrder 排序
                habits.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
                // 按分组筛选
                if (appData.groupFilter) {
                    habits = habits.filter(h => h.group === appData.groupFilter);
                }
                return habits;
            }

            /** 收集所有已使用的分组（含自定义分组标签） */
            function getUsedGroups() {
                const set = new Set();
                appData.habits.forEach(h => { if (h.group) set.add(h.group); });
                return [...set];
            }

            /** 获取全部分组（预设 + 自定义）的标签映射 */
            function getAllGroupLabels() {
                const preset = HABIT_GROUPS.reduce((m, g) => { m[g.value] = g.label; return m; }, {});
                (appData.customGroups || []).forEach(g => { preset[g.value] = g.label; });
                return preset;
            }

            // ==================== 分享卡片（Canvas 绘制）====================

            /** 生成分享卡片图片 */
            function generateShareCard(habit) {
                const canvas = document.getElementById('shareCanvas');
                const ctx = canvas.getContext('2d');
                const W = canvas.width;
                const H = canvas.height;

                // 背景渐变
                const bgGrad = ctx.createLinearGradient(0, 0, W, H);
                bgGrad.addColorStop(0, '#fce4ec');
                bgGrad.addColorStop(0.5, '#f3e5f5');
                bgGrad.addColorStop(1, '#e8eaf6');
                ctx.fillStyle = bgGrad;
                ctx.beginPath();
                ctx.roundRect(0, 0, W, H, 24);
                ctx.fill();

                // 装饰圆点
                ctx.fillStyle = habit.color + '30';
                ctx.beginPath(); ctx.arc(280, 60, 50, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ce93d8' + '20';
                ctx.beginPath(); ctx.arc(50, 340, 70, 0, Math.PI*2); ctx.fill();

                // 标题
                ctx.fillStyle = '#7e57c2';
                ctx.font = 'bold 22px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✨ 小习惯打卡', W/2, 70);

                // 习惯名称
                ctx.fillStyle = habit.color;
                ctx.font = 'bold 20px Nunito, sans-serif';
                ctx.fillText(habit.name, W/2, 130);

                // 统计数据
                const streak = calcStreak(habit.checkins);
                const total = calcTotal(habit.checkins);
                const stats = [
                    { label: '🔥 连续打卡', value: `${streak} 天` },
                    { label: '✅ 总打卡', value: `${total} 次` },
                    { label: '🏅 徽章', value: `${habit.badges ? habit.badges.length : 0} 枚` },
                ];
                const startX = 50;
                stats.forEach((s, i) => {
                    const x = startX + i * 88;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.roundRect(x, 170, 78, 60, 14);
                    ctx.fill();
                    ctx.fillStyle = '#b39ddb';
                    ctx.font = '11px Nunito, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(s.label, x + 39, 200);
                    ctx.fillStyle = '#7e57c2';
                    ctx.font = 'bold 20px Nunito, sans-serif';
                    ctx.fillText(s.value, x + 39, 222);
                });

                // 徽章展示
                if (habit.badges && habit.badges.length > 0) {
                    ctx.fillStyle = '#7e57c2';
                    ctx.font = 'bold 13px Nunito, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏅 已解锁徽章', W/2, 270);
                    const badgeIcons = habit.badges.slice(0, 6).map(d => {
                        const b = getBadgeByDays(d);
                        return b ? b.icon : '⭐';
                    }).join(' ');
                    ctx.font = '24px sans-serif';
                    ctx.fillText(badgeIcons, W/2, 302);
                }

                // 底部
                ctx.fillStyle = '#ce93d8';
                ctx.font = 'bold 13px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('每天一小步，坚持大不同 🌱', W/2, 360);
                ctx.fillStyle = '#b39ddb';
                ctx.font = '10px Nunito, sans-serif';
                ctx.fillText('来自：小习惯打卡', W/2, 395);

                // 显示分享浮层
                document.getElementById('shareOverlay').classList.remove('hidden');
            }

            /** 下载分享卡片为 PNG */
            function downloadShareCard() {
                const canvas = document.getElementById('shareCanvas');
                const link = document.createElement('a');
                link.download = `习惯打卡分享_${formatDate(new Date())}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('📸 图片已保存！');
            }

            // ==================== 习惯 CRUD ====================

            /** 新增习惯 */
            function addHabit(name, color, group, reminderTime, reminderEnabled) {
                const habit = {
                    id: generateId(),
                    name: name.trim(),
                    color: color || DEFAULT_COLOR,
                    checkins: [],
                    /** @type {Object.<string, string>} 日记映射：日期 → 日记内容 */
                    diaries: {},
                    /** @type {number[]} 已解锁的徽章里程碑天数列表 */
                    badges: [],
                    /** @type {Object.<string, string>} 心情映射：日期 → emoji */
                    moods: {},
                    /** 习惯分组 */
                    group: group || '',
                    /** 排序序号（按创建时间） */
                    sortOrder: appData.habits.length,
                    /** 每日提醒时间 */
                    reminderTime: reminderTime || null,
                    reminderEnabled: reminderEnabled || false,
                    /** 补签卡数量 */
                    makeUpCards: 0,
                    /** 休息日列表 */
                    restDays: [],
                    /** @type {Object.<string, string[]>} 照片映射：日期 → base64数组 */
                    photos: {},
                };
                appData.habits.push(habit);
                saveData();
                return habit;
            }

            /** 更新习惯 */
            function updateHabit(id, name, color, group, reminderTime, reminderEnabled) {
                const habit = appData.habits.find(h => h.id === id);
                if (!habit) return;
                habit.name = name.trim();
                habit.color = color;
                if (group !== undefined) habit.group = group;
                if (reminderTime !== undefined) habit.reminderTime = reminderTime;
                if (reminderEnabled !== undefined) habit.reminderEnabled = reminderEnabled;
                saveData();
            }

            /** 删除习惯 */
            function deleteHabit(id) {
                appData.habits = appData.habits.filter(h => h.id !== id);
                if (appData.expandedHabitId === id) {
                    appData.expandedHabitId = null;
                }
                saveData();
            }

            /** 根据 ID 查找习惯 */
            function findHabit(id) {
                return appData.habits.find(h => h.id === id);
            }

            /**
             * 切换某日打卡状态（打卡↔取消打卡）
             * @returns {{ action: string, badge?: Object }|undefined}
             *   - action: 'checked' | 'unchecked'
             *   - badge: 新解锁的徽章信息（仅在打卡时可能返回）
             */
            function toggleCheckin(habitId, dateStr) {
                // 禁止未来日期打卡
                if (isFuture(dateStr)) {
                    showToast('⏳ 不能提前打卡未来的日期哦～');
                    return;
                }

                const habit = findHabit(habitId);
                if (!habit) return;

                // 确保所有字段存在（兼容旧数据迁移）
                if (!habit.diaries) habit.diaries = {};
                if (!habit.badges) habit.badges = [];
                if (!habit.moods) habit.moods = {};
                if (habit.group === undefined) habit.group = '';
                if (habit.sortOrder === undefined) habit.sortOrder = 0;
                if (habit.reminderTime === undefined) habit.reminderTime = null;
                if (habit.reminderEnabled === undefined) habit.reminderEnabled = false;
                if (habit.makeUpCards === undefined) habit.makeUpCards = 0;
                if (!habit.restDays) habit.restDays = [];
                if (!habit.photos) habit.photos = {};

                const idx = habit.checkins.indexOf(dateStr);
                if (idx >= 0) {
                    // 已打卡 → 取消打卡（同时清理该日日记）
                    habit.checkins.splice(idx, 1);
                    delete habit.diaries[dateStr];
                    saveData();
                    return { action: 'unchecked' };
                } else {
                    // 未打卡 → 打卡（自动去重，禁止重复打卡的逻辑已由数组保证）
                    habit.checkins.push(dateStr);
                    // 按日期排序，保持数据整洁
                    habit.checkins.sort();
                    // 检查是否有新徽章解锁
                    const newBadge = checkAndUnlockBadges(habit);
                    // 检查是否获得补签卡
                    awardMakeUpCard(habit);
                    // 每日首次打卡奖励扭蛋币
                    const todayStr2 = formatDate(new Date());
                    if (appData.lastCheckinDate !== todayStr2) {
                        appData.gachaCoins = (appData.gachaCoins || 0) + 1;
                        appData.lastCheckinDate = todayStr2;
                    }
                    // 播放打卡音效
                    playCheckinSound();
                    saveData();
                    // 推送到 Supabase 实时同步
                    if (syncRoomCode) setTimeout(() => pushMyData(), 100);
                    // 触发彩蛋（延迟执行不阻塞UI）
                    setTimeout(() => triggerEasterEggs(habit), 300);
                    return { action: 'checked', badge: newBadge };
                }
            }

            /** 渲染月份/周/年标签文字 */
            function renderMonthLabel() {

                const today = new Date();

                    isMaxMonth = appData.viewYear >= today.getFullYear() && appData.viewMonth >= today.getMonth();

            /**
             * 构建日历视图 DOM（根据当前视图模式分发）
             * @param {Habit} habit
             * @returns {HTMLElement}
             */
            function buildCalendarGrid(habit) {
                if (appData.viewMode === 'week') return buildWeekView(habit);
                if (appData.viewMode === 'year') return buildYearHeatmap(habit);
                return buildMonthGrid(habit);
            }

            /**
             * 构建月历网格 DOM
             * @param {Habit} habit
             * @returns {HTMLElement}
             */
            function buildMonthGrid(habit) {
                const { viewYear, viewMonth } = appData;
                const checkinSet = new Set(habit.checkins);
                const todayStr = formatDate(new Date());
                const totalDays = daysInMonth(viewYear, viewMonth);
                const startOffset = firstDayOfMonth(viewYear, viewMonth); // 前面空几格

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-7 gap-1 mt-3 text-center';

                // ----- 星期标题行：一 二 三 四 五 六 日 -----
                const weekLabels = ['一', '二', '三', '四', '五', '六', '日'];
                weekLabels.forEach((label, i) => {
                    const header = document.createElement('div');
                    header.className =
                        'text-xs font-extrabold py-1 text-purple-400';
                    // 周末用粉色区分
                    if (i >= 5) header.style.color = '#f48fb1';
                    header.textContent = label;
                    grid.appendChild(header);
                });

                // ----- 前置空白格（月首偏移）-----
                for (let i = 0; i < startOffset; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'aspect-square';
                    grid.appendChild(empty);
                }

                // ----- 日期格子 -----
                for (let day = 1; day <= totalDays; day++) {
                    const dateStr =
                        `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const checked = checkinSet.has(dateStr);
                    const today = dateStr === todayStr;
                    const future = isFuture(dateStr);

                    const cell = document.createElement('div');
                    cell.className =
                        'aspect-square flex items-center justify-center rounded-xl text-sm font-bold transition-all cursor-pointer';
                    cell.textContent = day;

                    // 检查该日期是否有日记和照片
                    const hasDiary = !!(habit.diaries && habit.diaries[dateStr]);
                    const hasPhoto = !!(habit.photos && habit.photos[dateStr] && habit.photos[dateStr].length > 0);

                    if (checked) {
                        // 已打卡：填充习惯颜色
                        cell.style.backgroundColor = habit.color;
                        cell.style.color = '#fff';
                        cell.style.boxShadow = `0 2px 8px ${habit.color}55`;
                        cell.style.position = 'relative';
                        // 有日记时在底部显示小白点
                        if (hasDiary || hasPhoto) {
                            const indicator = document.createElement('span');
                            indicator.className = 'diary-dot';
                            indicator.style.background = hasPhoto ? '#ffeb3b' : '#fff';
                            indicator.style.bottom = hasDiary && hasPhoto ? '8px' : '2px';
                            indicator.style.boxShadow = hasPhoto ? '0 0 4px rgba(255,235,59,0.8)' : '0 0 4px rgba(255,255,255,0.7)';
                            cell.appendChild(indicator);
                        }
                        if (hasDiary && hasPhoto) {
                            const diaryDot2 = document.createElement('span');
                            diaryDot2.className = 'diary-dot';
                            diaryDot2.style.background = '#fff';
                            diaryDot2.style.boxShadow = '0 0 4px rgba(255,255,255,0.7)';
                            cell.appendChild(diaryDot2);
                        }
                    } else if (today) {
                        // 今天未打卡：虚线边框高亮
                        cell.style.backgroundColor = '#fff';
                        cell.style.color = '#7e57c2';
                        cell.style.border = '2.5px dashed #ce93d8';
                    } else if (future) {
                        // 未来日期：灰色、不可点击
                        cell.style.color = '#d1c4e9';
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                    } else {
                        // 普通过去日期：浅紫背景
                        cell.style.backgroundColor = '#faf5ff';
                        cell.style.color = '#b39ddb';
                    }

                    // 点击切换打卡状态（未来日期已禁用指针事件）
                    if (!future) {
                        cell.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (checked) {
                                // 已打卡日期 → 打开日记弹窗（可写日记或取消打卡）
                                openDiaryModal(habit, dateStr);
                            } else {
                                // 未打卡 → 执行打卡
                                const result = toggleCheckin(habit.id, dateStr);
                                if (!result) return;
                                if (result.action === 'checked') {
                                    showToast('✅ 打卡成功！点击日期写日记吧～');
                                    // 有新徽章解锁则播放庆祝动画
                                    if (result.badge) {
                                        showBadgeUnlock(result.badge);
                                    }
                                    renderAll();
                                    // 打卡后自动打开日记弹窗方便用户记录
                                    setTimeout(() => {
                                        const h = findHabit(habit.id);
                                        if (h) openDiaryModal(h, dateStr);
                                    }, 600);
                                }
                            }
                        });
                    }

                    grid.appendChild(cell);
                }

                return grid;
            }

            /**
             * 构建周视图 DOM（横向 7 天条）
             * @param {Habit} habit
             * @returns {HTMLElement}
             */
            function buildWeekView(habit) {
                const today = new Date();
                const dayOfWeek = (today.getDay() + 6) % 7; // 周一=0
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - dayOfWeek + appData.viewWeekOffset * 7);
                const checkinSet = new Set(habit.checkins);
                const todayStr = formatDate(today);

                const container = document.createElement('div');
                container.className = 'mt-3';

                const strip = document.createElement('div');
                strip.className = 'week-strip';

                const weekLabels = ['一', '二', '三', '四', '五', '六', '日'];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(weekStart);
                    d.setDate(weekStart.getDate() + i);
                    const dateStr = formatDate(d);
                    const checked = checkinSet.has(dateStr);
                    const isTodayDate = dateStr === todayStr;
                    const future = isFuture(dateStr);
                    const mood = getMood(habit, dateStr);

                    const cell = document.createElement('div');
                    cell.className = 'week-cell';
                    cell.style.position = 'relative';
                    cell.textContent = `${weekLabels[i]}\n${d.getDate()}`;
                    cell.style.whiteSpace = 'pre-line';
                    cell.style.fontSize = '11px';

                    if (checked) {
                        cell.style.backgroundColor = habit.color;
                        cell.style.color = '#fff';
                        cell.style.boxShadow = `0 2px 8px ${habit.color}55`;
                    } else if (isTodayDate) {
                        cell.style.backgroundColor = '#fff';
                        cell.style.color = '#7e57c2';
                        cell.style.border = '2.5px dashed #ce93d8';
                    } else if (future) {
                        cell.style.color = '#d1c4e9';
                        cell.style.opacity = '0.5';
                        cell.style.pointerEvents = 'none';
                    } else {
                        cell.style.backgroundColor = '#faf5ff';
                        cell.style.color = '#b39ddb';
                    }

                    // 心情小图标
                    if (mood) {
                        const moodSpan = document.createElement('span');
                        moodSpan.style.cssText = 'position:absolute;top:-2px;right:0;font-size:11px;';
                        moodSpan.textContent = mood;
                        cell.appendChild(moodSpan);
                    }

                    // 日记指示器
                    if (habit.diaries && habit.diaries[dateStr]) {
                        const dot = document.createElement('span');
                        dot.className = 'diary-dot';
                        if (checked) { dot.style.background = '#fff';
                            dot.style.boxShadow = '0 0 4px rgba(255,255,255,0.7)'; }
                        cell.appendChild(dot);
                    }

                    if (!future) {
                        cell.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (checked) {
                                openDiaryModal(habit, dateStr);
                            } else {
                                const result = toggleCheckin(habit.id, dateStr);
                                if (!result) return;
                                if (result.action === 'checked') {
                                    showToast('✅ 打卡成功！');
                                    if (result.badge) showBadgeUnlock(result.badge);
                                    renderAll();
                                    setTimeout(() => {
                                        const h = findHabit(habit.id);
                                        if (h) openDiaryModal(h, dateStr);
                                    }, 600);
                                }
                            }
                        });
                    }

                    strip.appendChild(cell);
                }

                container.appendChild(strip);
                return container;
            }

            /**
             * 构建年度热力图 DOM（GitHub 风格）
             * @param {Habit} habit
             * @returns {HTMLElement}
             */
            function buildYearHeatmap(habit) {
                const { viewYear } = appData;
                const checkinSet = new Set(habit.checkins);
                const container = document.createElement('div');
                container.className = 'mt-3';

                // 计算该年第一天是周几（周一=0）
                const yearStart = new Date(viewYear, 0, 1);
                const yearStartDay = (yearStart.getDay() + 6) % 7;
                const totalDays = (viewYear % 4 === 0 && (viewYear % 100 !== 0 || viewYear % 400 === 0)) ? 366 : 365;
                const totalWeeks = Math.ceil((yearStartDay + totalDays) / 7);

                const heatmap = document.createElement('div');
                heatmap.className = 'heatmap-grid';

                // 月份标签
                const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
                const monthHeader = document.createElement('div');
                monthHeader.className = 'flex gap-0.5 mb-1 text-xs text-purple-400 font-semibold';
                // Simplified month header
                const monRow = document.createElement('div');
                monRow.className = 'text-xs text-purple-400 font-semibold mb-1.5';
                monRow.textContent = `${viewYear} 年打卡热力图`;
                container.appendChild(monRow);

                for (let w = 0; w < totalWeeks; w++) {
                    const week = document.createElement('div');
                    week.className = 'heatmap-week';
                    for (let d = 0; d < 7; d++) {
                        const dayIdx = w * 7 + d - yearStartDay;
                        const cell = document.createElement('div');
                        cell.className = 'heatmap-cell';
                        if (dayIdx >= 0 && dayIdx < totalDays) {
                            const date = new Date(viewYear, 0, dayIdx + 1);
                            const dateStr = formatDate(date);
                            if (checkinSet.has(dateStr)) {
                                cell.classList.add('filled');
                                cell.style.backgroundColor = habit.color;
                                cell.style.boxShadow = `0 0 4px ${habit.color}55`;
                            }
                            cell.title = dateStr + (checkinSet.has(dateStr) ? ' ✅' : '');
                            cell.style.cursor = 'default';
                        } else {
                            cell.style.background = 'transparent';
                        }
                        week.appendChild(cell);
                    }
                    heatmap.appendChild(week);
                }

                // 图例
                const legend = document.createElement('div');
                legend.className = 'flex items-center gap-2 mt-2 text-xs text-purple-400 font-semibold';
                legend.innerHTML = '<span>少</span>';
                ['#f0e6f6', habit.color + '55', habit.color + 'aa', habit.color].forEach(clr => {
                    const box = document.createElement('span');
                    box.style.cssText = `width:12px;height:12px;border-radius:3px;background:${clr};display:inline-block;`;
                    legend.appendChild(box);
                });
                legend.appendChild(document.createTextNode('多'));
                container.appendChild(heatmap);
                container.appendChild(legend);
                return container;
            }

            ];

            /** 加权随机抽取 */
            function gachaPull() {
                const total = GACHA_PRIZES.reduce((s, p) => s + p.weight, 0);
                let rand = Math.random() * total;
                for (const prize of GACHA_PRIZES) {
                    rand -= prize.weight;
                    if (rand <= 0) return prize;
                }
                return GACHA_PRIZES[0];
            }

            /** 十连抽（保底至少1个SR+） */
            function gachaMultiPull() {
                const results = [];
                let hasSRPlus = false;
                for (let i = 0; i < 10; i++) {
                    const prize = gachaPull();
                    results.push(prize);
                    if (prize.tier === 'SR' || prize.tier === 'SSR') hasSRPlus = true;
                }
                // 保底：如果10连无SR+，替换最后一个为随机SR
                if (!hasSRPlus) {
                    const srPrizes = GACHA_PRIZES.filter(p => p.tier === 'SR' || p.tier === 'SSR');
                    results[9] = srPrizes[Math.floor(Math.random() * srPrizes.length)];
                }
                return results;
            }

            /** 处理扭蛋奖励 */
            function applyGachaPrize(prize) {
                if (prize.type === 'makeup') {
                    // 补签卡加到当前有打卡的随机习惯上（或第一个习惯）
                    const anyHabit = appData.habits.find(h => h.checkins.length > 0) || appData.habits[0];
                    if (anyHabit) anyHabit.makeUpCards = (anyHabit.makeUpCards || 0) + prize.value;
                } else if (prize.type === 'coin') {
                    appData.gachaCoins += prize.value;
                } else if (prize.type === 'theme_random') {
                    const locked = THEMES.filter(t => !appData.ownedThemes.includes(t.id) && t.price > 0);
                    if (locked.length > 0) {
                        const t = locked[Math.floor(Math.random() * locked.length)];
                        appData.ownedThemes.push(t.id);
                        showToast(`🎨 解锁主题：${t.name}！`);
                    }
                } else if (prize.type === 'theme_pick') {
                    showToast('🌟 获得金色传说！可在主题商店兑换任意主题');
                    appData.goldenTicket = (appData.goldenTicket || 0) + 1;
                }
                // sticker 类仅作收集展示
                if (!appData.inventory) appData.inventory = [];
                appData.inventory.push({ name: prize.name, icon: prize.icon, tier: prize.tier, time: Date.now() });

            // ---------- 🌸 虚拟花园 ----------

            /** 根据连续打卡天数获取植物阶段 */
            function getPlantStage(streak, checkins) {
                if (!checkins || checkins.length === 0) return { icon: '🌰', stage: 'seed', label: '种子' };
                if (streak === 0) return { icon: '🥀', stage: 'wilted', label: '枯萎' };
                if (streak < 3) return { icon: '🌱', stage: 'sprout', label: '发芽' };
                if (streak < 7) return { icon: '🪴', stage: 'growing', label: '生长' };
                if (streak < 14) return { icon: '🌿', stage: 'leafing', label: '茂盛' };
                if (streak < 21) return { icon: '🌷', stage: 'budding', label: '含苞' };
                if (streak < 30) return { icon: '🌸', stage: 'blooming', label: '盛开' };
                if (streak < 60) return { icon: '🌺', stage: 'flowering', label: '绽放' };
                if (streak < 100) return { icon: '🌻', stage: 'shining', label: '灿烂' };
                return { icon: '🍎', stage: 'fruiting', label: '结果' };
            }

            function renderGarden() {
