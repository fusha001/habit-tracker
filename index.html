            // ---------- 🎵 背景音系统 ----------

            /** 音轨配置 */
            const BGM_TRACKS = [
                { id: 'rain', icon: '🌧️', name: '雨声', freq: 200, unlockDay: 0 },
                { id: 'campfire', icon: '🔥', name: '篝火', freq: 150, unlockDay: 0 },
                { id: 'forest', icon: '🌲', name: '森林', freq: 400, unlockDay: 3 },
                { id: 'ocean', icon: '🌊', name: '海浪', freq: 100, unlockDay: 7 },
                { id: 'cafe', icon: '☕', name: '咖啡馆', freq: 300, unlockDay: 14 },
                { id: 'lullaby', icon: '🎶', name: '摇篮曲', freq: 500, unlockDay: 21 },
            ];

            let bgmAudioCtx = null;
            let bgmOscillator = null;
            let bgmGain = null;
            let bgmCurrentTrack = null;

            /** 初始化音频上下文 */
            function initAudio() {
                if (!bgmAudioCtx) {
                    bgmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            /** 播放简单环境音（用振荡器模拟） */
            function playBgmTrack(trackId) {
                initAudio();
                stopBgm();
                const track = BGM_TRACKS.find(t => t.id === trackId);
                if (!track) return;

                bgmCurrentTrack = track;
                bgmGain = bgmAudioCtx.createGain();
                bgmGain.gain.value = 0.08;
                bgmGain.connect(bgmAudioCtx.destination);

                // 用多个振荡器模拟环境音
                for (let i = 0; i < 3; i++) {
                    const osc = bgmAudioCtx.createOscillator();
                    osc.type = i === 0 ? 'sine' : i === 1 ? 'triangle' : 'sawtooth';
                    osc.frequency.value = track.freq * (0.8 + Math.random() * 0.4);
                    const g = bgmAudioCtx.createGain();
                    g.gain.value = 0.03 + Math.random() * 0.02;
                    osc.connect(g);
                    g.connect(bgmGain);
                    osc.start();
                    if (!bgmOscillator) bgmOscillator = [];
                    bgmOscillator.push(osc);
                }
                document.getElementById('bgmFab').classList.add('playing');
                renderBgmPanel();
            }

            function stopBgm() {
                if (bgmOscillator) {
                    bgmOscillator.forEach(o => { try { o.stop(); } catch (e) {} });
                    bgmOscillator = null;
                }
                bgmCurrentTrack = null;
                document.getElementById('bgmFab').classList.remove('playing');
                renderBgmPanel();
            }

            /** 打卡音效 */
            function playCheckinSound() {
                initAudio();
                const osc = bgmAudioCtx.createOscillator();
                const gain = bgmAudioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, bgmAudioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, bgmAudioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, bgmAudioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, bgmAudioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(bgmAudioCtx.destination);
                osc.start();
                osc.stop(bgmAudioCtx.currentTime + 0.35);
            }

            /** 渲染 BGM 面板 */
            function renderBgmPanel() {
                const list = document.getElementById('bgmTrackList');
                list.innerHTML = '';
                const maxStreak = Math.max(...appData.habits.map(h => calcStreak(h.checkins)), 0);
                BGM_TRACKS.forEach(track => {
                    const unlocked = maxStreak >= track.unlockDay;
                    const item = document.createElement('div');
                    item.className = 'bgm-track' + (bgmCurrentTrack && bgmCurrentTrack.id === track.id ? ' active' : '') + (unlocked ? '' : ' locked');
                    item.textContent = `${track.icon} ${track.name}${unlocked ? '' : ' 🔒'}`;
                    if (unlocked) {
                        item.addEventListener('click', () => playBgmTrack(track.id));
                    } else {
                        item.title = `连续打卡${track.unlockDay}天解锁`;
                    }
                    list.appendChild(item);
                });
            }

                const m = now.getMonth() + 1;

            /** 撒花特效 */
            function spawnConfetti(count = 40) {
                const container = document.getElementById('fxContainer');
                const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#ff8787','#74c0fc'];

            /** 烟花特效 */
            function spawnFirework(x, y) {
                const container = document.getElementById('fxContainer');
                const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8'];
                for (let i = 0; i < 20; i++) {
                    const p = document.createElement('div');
                    p.className = 'firework-particle';
                    p.style.left = x + 'px';
                    p.style.top = y + 'px';
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    const angle = (Math.PI * 2 * i) / 20;
                    const dist = 40 + Math.random() * 60;
                    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                    container.appendChild(p);
                    setTimeout(() => p.remove(), 1000);
                }
            }

            /** 获取或初始化挑战列表 */
            function getChallenges() {
                if (!appData.challenges) appData.challenges = [];
                // 初始化预设挑战
                CHALLENGE_TEMPLATES.forEach(tmpl => {
                    if (!appData.challenges.find(c => c.id === tmpl.id)) {
                        appData.challenges.push({
                            ...tmpl,
                            progress: 0,
                            completed: false,
                            claimed: false,
                            startDate: formatDate(new Date()),
                        });
                    }
                });
                return appData.challenges;
            }

            /** 更新挑战进度 */
            function updateChallengeProgress() {
                const challenges = getChallenges();
                const now = new Date();
                let changed = false;

                challenges.forEach(c => {
                    if (c.completed && c.claimed) return;

                    if (c.type === 'streak_any') {
                        const maxStreak = Math.max(...appData.habits.map(h => calcStreak(h.checkins)), 0);
                        c.progress = Math.min(maxStreak, c.target);
                    } else if (c.type === 'monthly_total') {
                        const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                        const total = appData.habits.reduce((s, h) => s + h.checkins.filter(d => d.startsWith(monthPrefix)).length, 0);
                        c.progress = Math.min(total, c.target);
                    } else if (c.type === 'early_streak') {
                        // 简化：检查连续打卡天数
                        const maxStreak = Math.max(...appData.habits.map(h => calcStreak(h.checkins)), 0);
                        c.progress = Math.min(maxStreak, c.target);
                    }

                    if (c.progress >= c.target && !c.completed) {
                        c.completed = true;
                        changed = true;
                    }
                });

                if (changed) saveData();
                return challenges;
            }

                const challenges = getChallenges();

                c.claimed = true;
                appData.gachaCoins = (appData.gachaCoins || 0) + c.rewardCoin;
                saveData();
                spawnConfetti(30);
                showToast(`🏆 挑战完成！获得 ${c.rewardCoin} 扭蛋币～`);

            /** 应用主题 */
            function applyTheme(themeId) {
                const theme = THEMES.find(t => t.id === themeId);
                if (!theme) return;
                appData.activeTheme = themeId;
                // 通过 CSS 变量应用主题颜色
                const root = document.documentElement;
                const defaultTheme = THEMES.find(t => t.id === 'default');
                Object.entries(theme.css).forEach(([key, val]) => {
                    root.style.setProperty(key, val);
                });
                // 星空主题需要特殊处理文字颜色
                if (themeId === 'starry') {
                    document.body.style.color = '#e0d8f0';
                } else {
                    document.body.style.color = '';
                }
                saveData();
                showToast(`🎨 已切换至「${theme.name}」主题`);
            }

            /** 购买主题 */
            function buyTheme(themeId) {
                const theme = THEMES.find(t => t.id === themeId);
                if (!theme || theme.price <= 0) return;
                if (appData.ownedThemes.includes(themeId)) return;
                if (appData.goldenTicket > 0) {
                    appData.goldenTicket--;
                    appData.ownedThemes.push(themeId);
                    saveData();
                    showToast(`🎨 使用金色传说券解锁「${theme.name}」！`);
                    renderThemeShop();
                    return;
                }
                if ((appData.gachaCoins || 0) < theme.price) {
                    showToast('🪙 扭蛋币不足～');
                    return;
                }
                appData.gachaCoins -= theme.price;
                appData.ownedThemes.push(themeId);
                saveData();
                showToast(`🎨 解锁「${theme.name}」主题！`);
                applyTheme(themeId);
                renderThemeShop();
                renderAll();
            }

            // ==================== 📸 照片管理 ====================

            /** 压缩并保存照片 */
            function addPhoto(habit, dateStr, file) {
                if (!file || !file.type.startsWith('image/')) { showToast('⚠️ 请选择图片文件'); return; }
                if (!habit.photos) habit.photos = {};
                if (!habit.photos[dateStr]) habit.photos[dateStr] = [];
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 压缩图片到最大300px宽
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxW = 300;
                        const scale = Math.min(1, maxW / img.width);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        habit.photos[dateStr].push(compressed);
                        saveData();
                        renderPhotoPreview(habit, dateStr);
                        showToast('📸 照片已保存！');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            /** 删除照片 */
            function deletePhoto(habit, dateStr, index) {
                if (!habit.photos || !habit.photos[dateStr]) return;
                habit.photos[dateStr].splice(index, 1);
                if (habit.photos[dateStr].length === 0) delete habit.photos[dateStr];
                saveData();
                renderPhotoPreview(habit, dateStr);
            }

            /** 渲染照片预览 */
            function renderPhotoPreview(habit, dateStr) {
                const container = document.getElementById('photoPreviewArea');
                if (!container) return;
                container.innerHTML = '';
                const photos = (habit.photos && habit.photos[dateStr]) || [];
                photos.forEach((dataUrl, i) => {
                    const wrap = document.createElement('span');
                    wrap.className = 'photo-thumb-wrap';
                    const img = document.createElement('img');
                    img.className = 'photo-thumb';
                    img.src = dataUrl;
                    img.addEventListener('click', () => {
                        document.getElementById('photoViewerImg').src = dataUrl;
                        document.getElementById('photoViewer').classList.remove('hidden');
                    });
                    const del = document.createElement('button');
                    del.className = 'photo-delete-btn';
                    del.textContent = '✕';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deletePhoto(habit, dateStr, i);
                    });
                    wrap.appendChild(img);
                    wrap.appendChild(del);
                    container.appendChild(wrap);
                });
            }

            // ==================== 📂 自定义群组管理 ====================

            /** 获取所有可用分组（预设 + 自定义） */
            function getAllGroups() {
                const preset = HABIT_GROUPS.map(g => ({ ...g, isPreset: true }));

                return [...preset, ...custom];

            function addCustomGroup(label) {

                if (!value) { showToast('⚠️ 请输入有效分组名'); return; }
                if (HABIT_GROUPS.find(g => g.value === value) || (appData.customGroups || []).find(g => g.value === value)) {
                    showToast('⚠️ 分组名已存在');

            function deleteCustomGroup(groupValue) {

                appData.customGroups = (appData.customGroups || []).filter(g => g.value !== groupValue);

            renderGroupSelector = function(selectedGroup) {

                const allGroups = getAllGroups();

                        btn.style.background = '#fff'; btn.style.color = '#b39ddb'; btn.style.borderColor = '#e1bee7';

                    btn.addEventListener('click', () => {
                        domGroupSelector.setAttribute('data-selected-group', g.value);
                        renderGroupSelector(g.value);

                });
                // 添加"删除分组"和"新建分组"行
                const manageRow = document.createElement('div');
                manageRow.className = 'group-add-row';
                const input = document.createElement('input');
                input.type = 'text'; input.placeholder = '新分组名...';
                input.className = 'flex-1 bg-purple-50 border border-purple-100 rounded-xl px-2 py-1 text-xs font-semibold text-purple-800 outline-none';
                input.maxLength = 10;
                const addBtn = document.createElement('button');
                addBtn.className = 'btn-tap px-3 py-1 rounded-xl text-xs font-bold text-white flex-shrink-0';
                addBtn.style.background = 'linear-gradient(135deg,#ce93d8,#ab47bc)';
                addBtn.textContent = '+添加';
                addBtn.addEventListener('click', () => addCustomGroup(input.value));
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-tap px-3 py-1 rounded-xl text-xs font-bold text-red-400 bg-red-50 flex-shrink-0';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', () => {
                    const customGroups = appData.customGroups || [];
                    if (customGroups.length === 0) { showToast('没有可删除的自定义分组'); return; }
                    const name = prompt('输入要删除的分组名：' + customGroups.map(g => g.label).join(', '));
                    if (name) deleteCustomGroup(name);

                manageRow.appendChild(addBtn);
                manageRow.appendChild(delBtn);

            // ==================== 🗓 节日节气日历视图 ====================

            /** 获取指定日期的节日/节气 */
            function getFestivalInfo(month, day) {
                const solar = SOLAR_TERMS.find(t => t.m === month && t.d === day);
                const trad = TRADITIONAL_FESTIVALS.find(f => f.m === month && f.d === day);
                if (solar && trad) return { ...solar, isSolar: true, isTrad: true, tradName: trad.name, tradIcon: trad.icon };
                if (solar) return { ...solar, isSolar: true };
                if (trad) return { name: trad.name, icon: trad.icon, desc: trad.desc, isTrad: true };
                return null;
            }

            /** 构建节日节气日历视图 */
            /**
             * 构建独立日历视图（显示所有节日节气 + 打卡摘要）
             * 不依赖单个习惯，展示全局打卡情况
             */
            function buildStandaloneCalendar() {
                const { viewYear, viewMonth } = appData;
                const today = new Date();
                const todayStr = formatDate(today);
                const totalDays = daysInMonth(viewYear, viewMonth);
                const startOffset = firstDayOfMonth(viewYear, viewMonth);

                const wrapper = document.createElement('div');
                wrapper.className = 'mt-3';

                // ===== 日历网格 =====
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-7 gap-1.5 text-center';

                // 星期标题
                ['一','二','三','四','五','六','日'].forEach((label, i) => {
                    const hdr = document.createElement('div');
                    hdr.className = 'text-xs font-extrabold py-1.5 text-purple-400';
                    if (i >= 5) hdr.style.color = '#f48fb1';
                    hdr.textContent = label;
                    grid.appendChild(hdr);
                });

                // 前置空白
                for (let i = 0; i < startOffset; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'aspect-square';
                    grid.appendChild(empty);
                }

                // 日期格子
                for (let day = 1; day <= totalDays; day++) {
                    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                    const isTodayDate = dateStr === todayStr;
                    const future = isFuture(dateStr);
                    const festival = getFestivalInfo(viewMonth + 1, day);

                    // 公历转农历
                    const solarDate = new Date(viewYear, viewMonth, day);
                    const lunar = solarToLunar(solarDate);
                    const lunarFest = getLunarFestival(lunar);
                    const isLunarFirst = (lunar.day === 1); // 农历月初一

                    // 统计当天有多少习惯打卡了
                    const checkedHabits = appData.habits.filter(h => h.checkins.includes(dateStr));
                    const checkedCount = checkedHabits.length;
                    const totalHabits = appData.habits.length;

                    const cell = document.createElement('div');
                    cell.className = 'flex flex-col items-center justify-center rounded-xl font-bold transition-all relative';
                    cell.style.aspectRatio = '1';
                    cell.style.cursor = totalHabits > 0 ? 'pointer' : 'default';
                    cell.style.padding = '1px';
                    cell.style.gap = '0px';

                    // 公历日期数字
                    const dayNum = document.createElement('span');
                    dayNum.textContent = day;
                    dayNum.style.lineHeight = '1.1';
                    dayNum.style.fontSize = '15px';
                    dayNum.style.fontWeight = '800';

                    // 农历日期文字
                    const lunarSpan = document.createElement('span');
                    lunarSpan.style.lineHeight = '1';
                    lunarSpan.style.fontSize = '8.5px';
                    lunarSpan.style.fontWeight = '600';
                    if (isLunarFirst) {
                        lunarSpan.textContent = lunar.monthName.replace('月','');
                        lunarSpan.style.color = '#e91e63';
                        lunarSpan.style.fontSize = '9px';
                        lunarSpan.style.fontWeight = '800';
                    } else if (lunarFest) {
                        lunarSpan.textContent = lunarFest;
                        lunarSpan.style.fontSize = '7.5px';
                        lunarSpan.style.color = '#f44336';
                    } else {
                        lunarSpan.textContent = lunar.dayName;
                        lunarSpan.style.color = '#9e9e9e';
                    }

                    if (isTodayDate) {
                        cell.style.backgroundColor = '#fff';
                        dayNum.style.color = '#7e57c2';
                        cell.style.border = '2.5px dashed #ce93d8';
                    } else if (future) {
                        dayNum.style.color = '#c4b5e0';
                        lunarSpan.style.color = '#d8d0e8';
                        cell.style.opacity = '0.7';
                        // 不再禁用点击：允许查看待办和纪念日信息
                    } else if (festival || lunarFest) {
                        cell.style.backgroundColor = '#fffbf0';
                        dayNum.style.color = '#f57c00';
                        cell.style.border = '1.5px solid #ffe0b2';
                    } else if (isLunarFirst) {
                        cell.style.backgroundColor = '#fff5f8';
                        dayNum.style.color = '#ab47bc';
                    } else {
                        cell.style.backgroundColor = '#faf5ff';
                        dayNum.style.color = '#b39ddb';
                    }

                    cell.appendChild(dayNum);
                    cell.appendChild(lunarSpan);

                    // 打卡摘要：显示彩色小圆点
                    if (checkedCount > 0) {
                        const dotsRow = document.createElement('div');
                        dotsRow.className = 'flex gap-0.5 flex-wrap justify-center';
                        dotsRow.style.maxWidth = '90%';
                        const maxDots = Math.min(checkedCount, 4); // 最多显示4个
                        for (let i = 0; i < maxDots; i++) {
                            const dot = document.createElement('span');
                            dot.style.cssText = `width:5px;height:5px;border-radius:50%;background:${checkedHabits[i].color};flex-shrink:0;`;
                            dotsRow.appendChild(dot);
                        }
                        if (checkedCount > 4) {
                            const more = document.createElement('span');
                            more.style.cssText = 'font-size:7px;color:#b39ddb;line-height:1;';
                            more.textContent = `+${checkedCount - 4}`;
                            dotsRow.appendChild(more);
                        }
                        cell.appendChild(dotsRow);
                    }

                    // 节日/节气图标
                    if (festival) {
                        const iconSpan = document.createElement('span');
                        iconSpan.style.cssText = 'position:absolute;top:-2px;right:-1px;font-size:11px;line-height:1;';
                        iconSpan.textContent = festival.icon;
                        iconSpan.title = `${festival.name}${festival.isTrad ? '（农历约）' : ''} — ${festival.desc}`;
                        cell.appendChild(iconSpan);
                    }

                    // 点击查看当天信息 + 待办列表（包括未来日期）
                    cell.addEventListener('click', () => {
                        if (future) {
                            // 未来日期：仅显示待办，不允许打卡
                            if (document.getElementById('todoListContainer')) {
                                renderTodoList(dateStr);
                            }
                        } else {
                            if (checkedCount > 0) {
                                const names = checkedHabits.map(h => h.name).join('、');
                                showToast(`📅 ${dateStr}\n已打卡：${names || '无'}`);
                            }
                            if (document.getElementById('todoListContainer')) {
                                renderTodoList(dateStr);
                            }
                        }
                    });

                    grid.appendChild(cell);
                }
                wrapper.appendChild(grid);

                // ===== 当月节日节气详细列表 =====
                const festivals = [];
                for (let d = 1; d <= totalDays; d++) {
                    const f = getFestivalInfo(viewMonth + 1, d);
                    if (f) festivals.push({ day: d, ...f });
                }

                if (festivals.length > 0) {
                    const listCard = document.createElement('div');
                    listCard.className = 'mt-4 p-4 rounded-2xl';
                    listCard.style.background = 'rgba(255,255,255,0.7)';

                    const listTitle = document.createElement('h3');
                    listTitle.className = 'text-sm font-extrabold text-purple-600 mb-3 text-center';
                    const midLunar2 = solarToLunar(new Date(viewYear, viewMonth, 15));
                    const monthName = `${viewMonth + 1}月`;
                    listTitle.innerHTML = `📅 ${viewYear}年${monthName} 节日与节气 <span class="text-xs text-purple-400">· 农历${midLunar2.monthName}</span>`;
                    listCard.appendChild(listTitle);

                    festivals.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'flex items-center gap-3 py-2 px-3 rounded-xl mb-1.5';
                        item.style.background = f.isTrad ? '#fff8e1' : '#f3e5f5';

                        const dayBadge = document.createElement('span');
                        dayBadge.className = 'font-extrabold text-sm flex-shrink-0';
                        dayBadge.style.cssText = `width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;`;
                        dayBadge.style.background = f.isTrad ? '#ffb74d' : '#ce93d8';
                        dayBadge.style.color = '#fff';
                        dayBadge.textContent = `${f.day}日`;

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'flex-1 min-w-0';
                        const nameRow = document.createElement('div');
                        nameRow.className = 'font-extrabold text-sm';
                        nameRow.style.color = f.isTrad ? '#e65100' : '#7b1fa2';
                        nameRow.innerHTML = `${f.icon} ${f.name} <span class="text-xs font-semibold opacity-60">${f.isTrad ? '传统节日' : '二十四节气'}</span>`;
                        const descRow = document.createElement('div');
                        descRow.className = 'text-xs font-semibold mt-0.5';
                        descRow.style.color = f.isTrad ? '#ff9800' : '#ab47bc';
                        descRow.textContent = f.desc + (f.isTrad ? '（农历日期为近似值）' : '');

                        infoDiv.appendChild(nameRow);
                        infoDiv.appendChild(descRow);
                        item.appendChild(dayBadge);
                        item.appendChild(infoDiv);
                        listCard.appendChild(item);
                    });

                    wrapper.appendChild(listCard);
                } else {
                    const emptyNote = document.createElement('div');
                    emptyNote.className = 'text-center text-sm text-purple-300 font-semibold py-6';
                    emptyNote.textContent = '📭 本月无节气或传统节日';
                    wrapper.appendChild(emptyNote);
                }

                return wrapper;
            }

            /** 更新 buildCalendarGrid 以支持节日视图（独立日历） */
            const _origBuildCalendarGrid = buildCalendarGrid;
            buildCalendarGrid = function(habit) {
                if (appData.viewMode === 'festival') return buildStandaloneCalendar();
                return _origBuildCalendarGrid(habit);
            };

            // ==================== 💝 纪念日系统 ====================

            /** 添加纪念日 */
            function addAnniversary(name, dateMMDD, icon) {
                if (!name.trim()) { showToast('请输入纪念日名称'); return; }
                if (!/^\d{2}-\d{2}$/.test(dateMMDD)) { showToast('日期格式应为 MM-DD'); return; }
                const m = parseInt(dateMMDD.slice(0,2)), d = parseInt(dateMMDD.slice(3,5));
                if (m < 1 || m > 12 || d < 1 || d > 31) { showToast('日期无效'); return; }
                appData.anniversaries.push({
                    id: generateId(),
                    name: name.trim(),
                    date: dateMMDD,
                    icon: icon || '🎂',
                });
                saveData();
                renderAnniversaryList();
                showToast('💝 纪念日已添加！');
            }

            /** 删除纪念日 */
            function deleteAnniversary(id) {
                appData.anniversaries = appData.anniversaries.filter(a => a.id !== id);
                saveData();
                renderAnniversaryList();
                showToast('🗑 纪念日已删除');
            }

            /** 获取某月所有纪念日 */
            function getMonthAnniversaries(year, month) {
                const mm = String(month + 1).padStart(2, '0');
                return (appData.anniversaries || []).filter(a => a.date.startsWith(mm));
            }

            /** 计算距离纪念日的天数 */
            function getAnniversaryCountdown(mmdd) {
                const now = new Date();
                const [m, d] = mmdd.split('-').map(Number);
                let target = new Date(now.getFullYear(), m - 1, d);
                if (target < now) target = new Date(now.getFullYear() + 1, m - 1, d);
                return Math.ceil((target - now) / 86400000);
            }

            /** 渲染纪念日管理列表 */
            function renderAnniversaryList() {
                const list = document.getElementById('anniversaryList');
                if (!list) return;
                list.innerHTML = '';
                const sorted = [...(appData.anniversaries || [])].sort((a, b) => a.date.localeCompare(b.date));
                if (sorted.length === 0) {
                    list.innerHTML = '<p class="text-sm text-purple-300 text-center py-4">还没有纪念日哦～</p>';
                    return;
                }
                sorted.forEach(a => {
                    const row = document.createElement('div');
                    row.className = 'anniversary-item';
                    const countdown = getAnniversaryCountdown(a.date);
                    row.innerHTML = `<span class="text-lg">${a.icon}</span><span class="text-sm font-bold text-purple-800 flex-1">${a.name}</span><span class="text-xs text-purple-400">${a.date}</span><span class="ann-countdown">${countdown === 0 ? '🎉今天' : countdown + '天后'}</span>`;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'group-del-btn flex-shrink-0';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', () => deleteAnniversary(a.id));
                    row.appendChild(delBtn);
                    list.appendChild(row);
                });
            }

            // ==================== ✅ 待办系统 ====================

            /** 添加待办 */
            function addTodo(text, dateStr) {
                if (!text.trim()) { showToast('请输入待办内容'); return; }
                appData.todos.push({
                    id: generateId(),
                    text: text.trim(),
                    date: dateStr,
                    done: false,
                });
                saveData();
                renderTodoList(dateStr);
                showToast('✅ 待办已添加！');
            }

            /** 切换待办完成状态 */
            function toggleTodoDone(todoId) {
                const todo = (appData.todos || []).find(t => t.id === todoId);
                if (!todo) return;
                todo.done = !todo.done;
                saveData();
            }

            /** 删除待办 */
            function deleteTodo(todoId) {
                appData.todos = (appData.todos || []).filter(t => t.id !== todoId);
                saveData();
            }

            /** 获取某日的待办列表 */
            function getDateTodos(dateStr) {
                return (appData.todos || []).filter(t => t.date === dateStr);
            }

            /** 计算某日待办完成数 */
            function getDateTodosDone(dateStr) {
                const todos = getDateTodos(dateStr);
                if (todos.length === 0) return { total: 0, done: 0 };
                return { total: todos.length, done: todos.filter(t => t.done).length };
            }

            /** 渲染待办列表（在日历下方） */
            function renderTodoList(dateStr) {
                const container = document.getElementById('todoListContainer');
                if (!container) return;
                const todos = getDateTodos(dateStr);
                container.innerHTML = '';
                const [y, m, d] = dateStr.split('-');

                const header = document.createElement('div');
                header.className = 'flex items-center gap-2 mb-2';
                header.innerHTML = `<span class="font-extrabold text-sm text-purple-700">📋 ${parseInt(m)}月${parseInt(d)}日 待办</span>`;
                container.appendChild(header);

                todos.forEach(todo => {
                    const row = document.createElement('div');
                    row.className = 'todo-item' + (todo.done ? ' done' : '');
                    const check = document.createElement('div');
                    check.className = 'todo-check' + (todo.done ? ' checked' : '');
                    check.textContent = todo.done ? '✓' : '';
                    check.addEventListener('click', () => {
                        toggleTodoDone(todo.id);
                        check.classList.toggle('checked', !todo.done);
                        row.classList.toggle('done', !todo.done);
                        check.textContent = !todo.done ? '✓' : '';
                        renderAll();
                    });
                    const text = document.createElement('span');
                    text.className = 'todo-text text-sm font-semibold text-purple-800 flex-1';
                    text.textContent = todo.text;
                    const del = document.createElement('button');
                    del.className = 'group-del-btn flex-shrink-0';
                    del.textContent = '✕';
                    del.addEventListener('click', () => {
                        deleteTodo(todo.id);
                        renderTodoList(dateStr);
                        renderAll();
                    });
                    row.appendChild(check);
                    row.appendChild(text);
                    row.appendChild(del);
                    container.appendChild(row);
                });

                // 添加新待办输入
                const addRow = document.createElement('div');
                addRow.className = 'flex gap-1.5 mt-2';
                const input = document.createElement('input');
                input.type = 'text'; input.placeholder = '新待办...';
                input.maxLength = 50;
                input.className = 'flex-1 bg-purple-50 border border-purple-100 rounded-xl px-3 py-2 text-xs font-semibold text-purple-800 outline-none';
                const addBtn = document.createElement('button');
                addBtn.className = 'btn-tap px-3 py-2 rounded-xl text-xs font-extrabold text-white flex-shrink-0';
                addBtn.style.background = 'linear-gradient(135deg,#ce93d8,#ab47bc)';
                addBtn.textContent = '+添加';
                addBtn.addEventListener('click', () => {
                    if (input.value.trim()) {
                        addTodo(input.value.trim(), dateStr);
                        input.value = '';
                        renderTodoList(dateStr);
                        renderAll();
                    }
                });
                addRow.appendChild(input);
                addRow.appendChild(addBtn);
                container.appendChild(addRow);
            }

            // ==================== 更新日历渲染（纪念日 + 待办标记）====================

            const _origBuildStandalone = buildStandaloneCalendar;
            buildStandaloneCalendar = function() {
                const wrapper = _origBuildStandalone();
                const { viewYear, viewMonth } = appData;

                // ---- 在日历格子上标记纪念日和待办 ----
                const grid = wrapper.querySelector('.grid');
                if (grid) {
                    const cells = grid.querySelectorAll('div[style]');
                    cells.forEach(cell => {
                        // 从cell内容解析日期数字
                        const daySpan = cell.querySelector('span:first-child');
                        if (!daySpan) return;
                        const day = parseInt(daySpan.textContent);
                        if (isNaN(day)) return;
                        const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                        const mmdd = `${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

                        // 纪念日标记
                        const anniversary = (appData.anniversaries || []).find(a => a.date === mmdd);
                        if (anniversary) {
                            const marker = document.createElement('span');
                            marker.className = 'anniversary-dot';
                            marker.textContent = anniversary.icon;
                            marker.title = anniversary.name;
                            marker.style.fontSize = '8px';
                            cell.style.position = 'relative';
                            cell.appendChild(marker);
                        }

                        // 待办标记
                        const todoInfo = getDateTodosDone(dateStr);
                        if (todoInfo.total > 0) {
                            const dot = document.createElement('span');
                            dot.className = 'todo-dot' + (todoInfo.done === todoInfo.total ? ' done' : '');
                            dot.style.position = 'absolute';
                            dot.style.top = '2px';
                            dot.style.left = '2px';
                            if (todoInfo.done === todoInfo.total) {
                                dot.style.background = '#bdbdbd';
                            }
                            cell.style.position = 'relative';
                            cell.appendChild(dot);
                        }
                    });
                }

                // ---- 纪念日列表卡片 ----
                const anniversaries = getMonthAnniversaries(viewYear, viewMonth);
                if (anniversaries.length > 0) {
                    const annCard = document.createElement('div');
                    annCard.className = 'mt-3 p-4 rounded-2xl';
                    annCard.style.background = 'rgba(255,240,245,0.75)';
                    annCard.innerHTML = '<h4 class="text-sm font-extrabold text-pink-500 mb-2">💝 本月纪念日</h4>';
                    anniversaries.forEach(a => {
                        const countdown = getAnniversaryCountdown(a.date);
                        const row = document.createElement('div');
                        row.className = 'anniversary-item';
                        row.innerHTML = `<span class="text-base">${a.icon}</span><span class="text-xs font-bold text-purple-800 flex-1">${a.name}</span><span class="text-xs text-purple-400">${a.date}</span><span class="ann-countdown">${countdown === 0 ? '🎉今天！' : countdown + '天后'}</span>`;
                        annCard.appendChild(row);
                    });
                    wrapper.appendChild(annCard);
                }

                // ---- 待办摘要 ----
                const monthPrefix = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
                const monthTodos = (appData.todos || []).filter(t => t.date.startsWith(monthPrefix));
                if (monthTodos.length > 0) {
                    const doneCount = monthTodos.filter(t => t.done).length;
                    const todoSummary = document.createElement('div');
                    todoSummary.className = 'mt-3 p-4 rounded-2xl';
                    todoSummary.style.background = 'rgba(232,245,233,0.7)';
                    todoSummary.innerHTML = `<h4 class="text-sm font-extrabold text-green-600 mb-1">✅ 本月待办</h4><p class="text-xs font-semibold text-green-500">${doneCount}/${monthTodos.length} 已完成</p>`;
                    wrapper.appendChild(todoSummary);
                }

                // ---- 待办列表容器（点击日期后填充）----
                const todoContainer = document.createElement('div');
                todoContainer.id = 'todoListContainer';
                todoContainer.className = 'mt-3';
                wrapper.appendChild(todoContainer);

                return wrapper;
            };

            // ==================== ☁️ Supabase 实时同步 ====================

            let supabase = null;
            let syncChannel = null;
            let syncRoomCode = null;

            /** 初始化 Supabase 连接 */
            function connectSupabase(url, key) {
                if (!url || !key) { showToast('请填写 Supabase URL 和 Key'); return; }
                try {
                    supabase = supabase.createClient(url, key);
                    showToast('✅ Supabase 已连接！');
                    document.getElementById('syncStatus').textContent = '✅ 已连接';
                    document.getElementById('syncStatus').style.color = '#66bb6a';
                    // 保存配置
                    appData.supabaseUrl = url;
                    appData.supabaseKey = key;
                    saveData();
                } catch (e) {
                    showToast('⚠️ 连接失败，请检查配置');
                }
            }

            /** 加入房间 */
            async function joinRoom(code) {
                if (!supabase) { showToast('请先连接 Supabase'); return; }
                if (!code.trim()) { showToast('请输入房间码'); return; }
                syncRoomCode = code.trim();
                document.getElementById('syncStatus').textContent = `🏠 房间: ${syncRoomCode}`;
                document.getElementById('syncStatus').style.color = '#7e57c2';
                appData.syncRoomCode = syncRoomCode;
                // 推送当前数据
                await pushMyData();
                // 订阅房间变化
                subscribeToRoom();
                saveData();
                showToast(`🏠 已加入房间「${syncRoomCode}」！`);
            }

            /** 推送我的数据到 Supabase */
            async function pushMyData() {
                if (!supabase || !syncRoomCode) return;
                const myCard = {
                    room_code: syncRoomCode,
                    user_name: appData.myName || '我',
                    user_color: appData.myColor || '#ce93d8',
                    habits_data: appData.habits.map(h => ({
                        name: h.name, color: h.color, checkins: h.checkins,
                        badges: h.badges, diaries: h.diaries,
                    })),
                    updated_at: new Date().toISOString(),
                };
                try {
                    await supabase.from('habit_friends').upsert(myCard, { onConflict: 'room_code,user_name' });
                } catch (e) {
                    console.warn('推送失败', e);
                }
            }

            /** 订阅房间内好友的实时更新 */
            function subscribeToRoom() {
                if (!supabase || !syncRoomCode) return;
                if (syncChannel) supabase.removeChannel(syncChannel);

                syncChannel = supabase
                    .channel('room_' + syncRoomCode)
                    .on('postgres_changes',
                        { event: '*', schema: 'public', table: 'habit_friends', filter: `room_code=eq.${syncRoomCode}` },
                        (payload) => {
                            if (payload.new && payload.new.user_name !== (appData.myName || '我')) {
                                // 收到好友数据更新
                                updateFriendFromSync(payload.new);
                            }
                        }
                    )
                    .subscribe();
                document.getElementById('syncStatus').textContent = `🟢 实时同步中 · 房间: ${syncRoomCode}`;
                document.getElementById('syncStatus').style.color = '#66bb6a';
            }

            /** 从同步数据更新好友 */
            function updateFriendFromSync(data) {
                if (!data || !data.user_name) return;
                const existing = (appData.friends || []).findIndex(f => f.name === data.user_name);
                const friend = {
                    id: data.user_name,
                    name: data.user_name,
                    color: data.user_color,
                    updatedAt: new Date(data.updated_at).getTime(),
                    habits: (data.habits_data || []).map(h => ({
                        name: h.name, color: h.color, checkins: h.checkins || [],
                        badges: h.badges || [],
                    })),
                    live: true, // 标记为实时好友
                };
                if (existing >= 0) {
                    appData.friends[existing] = friend;
                } else {
                    appData.friends.push(friend);
                }
                saveData();
                if (appData.viewMode === 'friends') renderAll();
            }

            /** 首次加载房间内所有好友数据 */
            async function loadRoomFriends() {
                if (!supabase || !syncRoomCode) return;
                try {
                    const { data, error } = await supabase
                        .from('habit_friends')
                        .select('*')
                        .eq('room_code', syncRoomCode);
                    if (data) {
                        data.forEach(d => {
                            if (d.user_name !== (appData.myName || '我')) {
                                updateFriendFromSync(d);
                            }
                        });
                    }
                } catch (e) {
                    console.warn('加载好友失败', e);
                }
            }

            /** 设置我的显示信息 */
            function setMyInfo() {
                const name = prompt('你的昵称（好友可见）：', appData.myName || '我');
                if (name) {
                    appData.myName = name.trim() || '我';
                    appData.myColor = MACARON_COLORS[Math.floor(Math.random() * MACARON_COLORS.length)].value;
                    saveData();
                    if (syncRoomCode) pushMyData();
                }
            }

            // ==================== 👥 好友系统 ====================

            /** 导出我的数据为好友卡片 */
            function exportMyFriendCard() {
                const name = prompt('请输入你的昵称（好友会看到）：', '我') || '我';
                const card = {
                    name: name,
                    color: MACARON_COLORS[Math.floor(Math.random() * MACARON_COLORS.length)].value,
                    updatedAt: Date.now(),
                    habits: appData.habits.map(h => ({
                        name: h.name,
                        color: h.color,
                        checkins: h.checkins,
                    })),
                };
                const blob = new Blob([JSON.stringify(card, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `好友打卡_${name}_${formatDate(new Date())}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 好友卡片已导出！发送给朋友吧～');
            }

            /** 生成分享链接（Base64编码嵌入URL） */
            function generateFriendLink() {
                const name = prompt('请输入你的昵称：', '我') || '我';
                const card = {
                    name: name,
                    color: MACARON_COLORS[Math.floor(Math.random() * MACARON_COLORS.length)].value,
                    updatedAt: Date.now(),
                    habits: appData.habits.map(h => ({
                        name: h.name,
                        color: h.color,
                        checkins: h.checkins,
                    })),
                };
                const encoded = btoa(encodeURIComponent(JSON.stringify(card)));
                const link = location.origin + location.pathname + '#friend=' + encoded;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(link).then(() => {
                        showToast('🔗 分享链接已复制！发给好友吧～');
                    });
                } else {
                    prompt('复制以下链接分享给好友：', link);
                }
            }

            /** 从URL hash中加载好友数据 */
            function loadFriendFromHash() {
                const hash = location.hash;
                if (hash.startsWith('#friend=')) {
                    try {
                        const encoded = hash.slice(8);
                        const card = JSON.parse(decodeURIComponent(atob(encoded)));
                        if (!card.name || !card.habits) return;
                        // 检查是否已存在同名好友，存在则更新
                        const existingIdx = (appData.friends || []).findIndex(f => f.name === card.name);
                        card.id = generateId(); // 始终使用新ID
                        if (existingIdx >= 0) {
                            appData.friends[existingIdx] = card;
                            showToast(`🔄 已更新好友「${card.name}」的最新数据！`);
                        } else {
                            appData.friends.push(card);
                            showToast(`👥 已添加好友「${card.name}」！`);
                        }
                        saveData();
                        // 清除hash避免重复加载
                        history.replaceState(null, '', location.pathname);
                        renderAll();
                    } catch (e) {
                        console.warn('好友链接解析失败', e);
                    }
                }
            }

            /** 刷新指定好友数据（重新从文件导入） */
            function refreshFriend() {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = '.json';
                input.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        importFriendCard(e.target.files[0]);
                        showToast('🔄 好友数据已更新！');
                    }
                });
                input.click();
            }

            /** 导入好友卡片 */
            function importFriendCard(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const card = JSON.parse(e.target.result);
                        if (!card.name || !card.habits) throw new Error('无效格式');
                        card.id = generateId();
                        card.color = card.color || '#ce93d8';
                        appData.friends.push(card);
                        saveData();
                        showToast(`👥 已添加好友「${card.name}」！`);
                        renderAll();
                    } catch (err) {
                        showToast('⚠️ 文件格式不正确');
                    }
                };
                reader.readAsText(file);
            }

            /** 删除好友 */
            function removeFriend(friendId) {
                appData.friends = appData.friends.filter(f => f.id !== friendId);
                saveData();
                showToast('👋 好友已移除');
                renderAll();
            }

            /** 渲染好友视图 */
            function renderFriendView() {
                domHabitList.innerHTML = '';

                // ---- 操作栏 ----
                const actionBar = document.createElement('div');
                actionBar.className = 'flex gap-2 mb-3';
                // 分享链接（复制到剪贴板）
                const linkBtn = document.createElement('button');
                linkBtn.className = 'btn-tap flex-1 py-3 rounded-2xl font-extrabold text-sm text-white';
                linkBtn.style.background = 'linear-gradient(135deg, #ce93d8, #ab47bc)';
                linkBtn.textContent = '🔗 复制分享链接';
                linkBtn.addEventListener('click', generateFriendLink);

                // 导出文件（下载）
                const exportBtn = document.createElement('button');
                exportBtn.className = 'btn-tap flex-1 py-3 rounded-2xl font-extrabold text-sm text-purple-600 bg-purple-50';
                exportBtn.textContent = '📤 导出文件';
                exportBtn.addEventListener('click', exportMyFriendCard);
                const importLabel = document.createElement('label');
                importLabel.className = 'btn-tap flex-1 py-3 rounded-2xl font-extrabold text-sm text-center text-purple-600 bg-purple-50 cursor-pointer';
                importLabel.textContent = '📥 导入好友卡片';
                const importInput = document.createElement('input');
                importInput.type = 'file'; importInput.accept = '.json'; importInput.className = 'hidden';
                importInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) { importFriendCard(e.target.files[0]);
                        e.target.value = ''; }
                });
                importLabel.appendChild(importInput);
                actionBar.appendChild(linkBtn);
                const btnCol = document.createElement('div');
                btnCol.className = 'flex flex-col gap-1.5 flex-1';
                btnCol.appendChild(exportBtn);
                btnCol.appendChild(importLabel);
                actionBar.appendChild(btnCol);
                domHabitList.appendChild(actionBar);

                // ---- 好友列表 ----
                if (!appData.friends || appData.friends.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'text-center py-12 text-purple-400 font-semibold text-sm';
                    empty.innerHTML = '👥<br>还没有好友哦～<br><span class="text-xs text-purple-300">导出你的打卡数据分享给朋友<br>或导入朋友的打卡文件查看TA的进度</span>';
                    domHabitList.appendChild(empty);
                    return;
                }

                (appData.friends || []).forEach(friend => {
                    const card = document.createElement('div');
                    card.className = 'friend-card mb-3';

                    // 好友头部
                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between mb-2';
                    const nameArea = document.createElement('div');
                    nameArea.className = 'flex items-center gap-2';
                    const dot = document.createElement('span');
                    dot.className = 'friend-streak-dot';
                    dot.style.background = friend.color;
                    const name = document.createElement('span');
                    name.className = 'font-extrabold text-base text-purple-800';
                    name.textContent = friend.name;
                    const habitCount = document.createElement('span');
                    habitCount.className = 'text-xs text-purple-400 font-semibold';
                    habitCount.textContent = `${friend.habits.length}个习惯`;
                    nameArea.appendChild(dot);
                    nameArea.appendChild(name);
                    nameArea.appendChild(habitCount);
                    // 更新时间
                    const updateTime = friend.updatedAt ? new Date(friend.updatedAt) : null;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'text-xs text-purple-300 font-semibold';
                    if (updateTime) {
                        const diff = Math.floor((Date.now() - updateTime) / 3600000);
                        timeSpan.textContent = diff < 1 ? '刚刚更新' : diff < 24 ? diff + '小时前' : Math.floor(diff/24) + '天前';
                    }
                    const refreshBtn = document.createElement('button');
                    refreshBtn.className = 'btn-tap px-2 py-1 rounded-lg text-xs font-bold text-purple-500 bg-purple-50';
                    refreshBtn.textContent = '🔄';
                    refreshBtn.title = '刷新好友数据（重新导入文件）';
                    refreshBtn.addEventListener('click', (e) => { e.stopPropagation(); refreshFriend(); });

                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'flex items-center gap-1';
                    btnGroup.appendChild(timeSpan);
                    btnGroup.appendChild(refreshBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-tap w-6 h-6 rounded-full bg-red-50 text-red-400 text-xs flex items-center justify-center';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', () => removeFriend(friend.id));
                    btnGroup.appendChild(delBtn);
                    header.appendChild(nameArea);
                    header.appendChild(btnGroup);
                    card.appendChild(header);

                    // 好友习惯列表
                    friend.habits.forEach(h => {
                        const row = document.createElement('div');
                        row.className = 'friend-habit-row';
                        const hDot = document.createElement('span');
                        hDot.className = 'friend-streak-dot';
                        hDot.style.background = h.color;
                        const hName = document.createElement('span');
                        hName.className = 'text-sm font-semibold text-purple-700 flex-1';
                        hName.textContent = h.name;
                        const streak = calcStreak(h.checkins);
                        const total = h.checkins ? h.checkins.length : 0;
                        const stats = document.createElement('span');
                        stats.className = 'text-xs font-bold text-purple-400';
                        stats.textContent = `🔥${streak}天 · ✅${total}次`;
                        row.appendChild(hDot);
                        row.appendChild(hName);
                        row.appendChild(stats);
                        card.appendChild(row);
                    });

                    domHabitList.appendChild(card);
                });
            }

            // ==================== 📅 年月选择器 & 点击动画 ====================

            /** 打开年月选择器 */
            function openYmPicker() {
                const overlay = document.getElementById('ymPickerOverlay');
                const yearGrid = document.getElementById('ymYearGrid');
                const monthGrid = document.getElementById('ymMonthGrid');
                const today = new Date();
                const curYear = appData.viewYear;
                const curMonth = appData.viewMonth;

                // 渲染年份（当前±5年）
                yearGrid.innerHTML = '';
                for (let y = today.getFullYear() - 5; y <= 2099; y++) {
                    const btn = document.createElement('button');
                    btn.className = 'ym-btn' + (y === curYear ? ' active' : '') + (y === today.getFullYear() ? ' today' : '');
                    btn.textContent = y;
                    btn.addEventListener('click', () => {
                        appData.viewYear = y;
                        openYmPicker(); // 刷新选择器
                    });
                    yearGrid.appendChild(btn);
                }

                // 渲染月份
                monthGrid.innerHTML = '';
                for (let m = 0; m < 12; m++) {
                    const btn = document.createElement('button');
                    btn.className = 'ym-btn' + (m === curMonth ? ' active' : '') + (m === today.getMonth() && curYear === today.getFullYear() ? ' today' : '');
                    btn.textContent = (m + 1) + '月';
                    btn.addEventListener('click', () => {
                        appData.viewMonth = m;
                        overlay.classList.add('hidden');
                        renderAll();
                        saveData();
                    });
                    monthGrid.appendChild(btn);
                }

                overlay.classList.remove('hidden');
                // 自动滚动到当前选中年份
                setTimeout(() => {
                    const activeBtn = yearGrid.querySelector('.ym-btn.active');
                    if (activeBtn) activeBtn.scrollIntoView({ block: 'center' });
                }, 100);
            }

            /** 关闭年月选择器 */
            document.getElementById('ymBtnClose').addEventListener('click', () => {
                document.getElementById('ymPickerOverlay').classList.add('hidden');
            });
            document.getElementById('ymPickerOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('ymPickerOverlay')) {
                    document.getElementById('ymPickerOverlay').classList.add('hidden');
                }
            });
            document.getElementById('ymBtnToday').addEventListener('click', () => {
                const today = new Date();
                appData.viewYear = today.getFullYear();
                appData.viewMonth = today.getMonth();
                document.getElementById('ymPickerOverlay').classList.add('hidden');
                renderAll();
                saveData();
            });

            /** 让月份标签可点击打开选择器（日历模式下） */
            domMonthLabel.style.cursor = 'pointer';
            domMonthLabel.title = '点击选择年月';
            domMonthLabel.addEventListener('click', () => {
                if (appData.viewMode === 'festival' || appData.viewMode === 'year') {
                    openYmPicker();
                }
            });

            /** 更新日历格子：添加点击缩放动画 */
            const _origBuildCells = buildStandaloneCalendar;
            // 在格子事件中添加动画类
            const origAddCellClick = Element.prototype.addEventListener;
            // 更简洁的方式：在 buildStandaloneCalendar 返回的 wrapper 上统一绑定
            const _buildCal2 = buildStandaloneCalendar;
            buildStandaloneCalendar = function() {
                const wrapper = _buildCal2();
                // 给所有日历格子添加点击动画
                const grid = wrapper.querySelector('.grid');
                if (grid) {
                    const cells = grid.querySelectorAll('div');
                    cells.forEach(cell => {
                        if (!cell.classList.contains('cal-cell-ripple')) {
                            cell.addEventListener('click', function(e) {
                                this.classList.remove('cal-cell-ripple');
                                void this.offsetWidth;
                                this.classList.add('cal-cell-ripple');
                            }, { once: false });
                        }
                    });
                }
                return wrapper;
            };

            // ==================== 允许查看到2099年 ====================

            /** 覆盖 renderMonthLabel - 日历模式允许未来年份 */
            const _origRenderMonth = renderMonthLabel;
            renderMonthLabel = function() {
                _origRenderMonth();
                // 日历模式：允许→按钮进入未来（上限2099年12月）
                if (appData.viewMode === 'festival') {
                    const isMax = appData.viewYear >= 2099 && appData.viewMonth >= 11;
                    const nextBtn = document.getElementById('btnNextMonth');
                    if (nextBtn) {
                        nextBtn.style.opacity = isMax ? '0.35' : '1';
                        nextBtn.style.pointerEvents = isMax ? 'none' : 'auto';
                    }
                }
            };

            /** 重新绑定→按钮：日历模式允许进入未来年份（上限2099年12月） */
            const nextBtnNew = document.getElementById('btnNextMonth');
            const nextBtnParent = nextBtnNew.parentNode;
            const nextClone = nextBtnNew.cloneNode(true);
            nextBtnParent.replaceChild(nextClone, nextBtnNew);
            document.getElementById('btnNextMonth').addEventListener('click', () => {
                const today = new Date();
                if (appData.viewMode === 'week') {
                    if (appData.viewWeekOffset >= 0) return;
                    appData.viewWeekOffset++;
                } else if (appData.viewMode === 'year') {
                    if (appData.viewYear >= 2099) return;
                    appData.viewYear++;
                } else if (appData.viewMode === 'festival') {
                    // 日历模式：可进入未来，上限2099年12月
                    if (appData.viewYear >= 2099 && appData.viewMonth >= 11) return;
                    if (appData.viewMonth === 11) { appData.viewMonth = 0; appData.viewYear++; }
                    else { appData.viewMonth++; }
                } else {
                    if (appData.viewYear >= today.getFullYear() && appData.viewMonth >= today.getMonth()) return;
                    if (appData.viewMonth === 11) { appData.viewMonth = 0; appData.viewYear++; }
                    else { appData.viewMonth++; }
                }
                appData.expandedHabitId = null;
                renderAll();
                saveData();
            });

            // ==================== 应用启动 ====================

            /** 初始化应用 */
            function init() {
                loadData();
                // 确保查看的月份不超过当月
                const today = new Date();
                if (
                    appData.viewYear > today.getFullYear() ||
                    (appData.viewYear === today.getFullYear() && appData.viewMonth > today.getMonth())
                ) {
                    appData.viewYear = today.getFullYear();
                    appData.viewMonth = today.getMonth();
                }
                renderAll();
                // 检查URL中是否有好友分享链接
                if (location.hash.startsWith('#friend=')) {
                    loadFriendFromHash();
                }
                initNotifications();
                // 应用已保存的主题
                if (appData.activeTheme && appData.activeTheme !== 'default') {
                    applyTheme(appData.activeTheme);
                }
                // 检查今天是否节日
                const festival = getTodayFestival();
                if (festival) {
                    setTimeout(() => spawnConfetti(40), 1500);
                }
                console.log('✨ 小习惯打卡应用已就绪！');
                console.log(`   📦 已加载 ${appData.habits.length} 个习惯`);
                console.log(`   🏅 徽章体系：${BADGE_TIERS.length} 个等级`);
                console.log(`   🎰 扭蛋机 · 🌸 虚拟花园 · 🎵 BGM`);
                console.log(`   🎉 节日彩蛋 · 🏆 挑战模式 · 🎨 主题商店`);
                console.log('   💾 数据存储于 localStorage:', STORAGE_KEY);
            }

            // 启动！
            init();

        })();
    </script>
</body>
</html>
